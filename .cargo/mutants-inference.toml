# cargo-mutants configuration for LANE C of the mutation-on-diff CI gate:
# strata-inference, built with `--features download,testkit`.
#
# **Inference exclusions belong here, not in `.cargo/mutants.toml`.** This file
# is passed with `--config`, which replaces the default config rather than
# adding to it, so the default config never applies to this lane. See the
# partition table in `.cargo/mutants.toml`.

# Constructible `Err(..)` replacement for `Result`-returning functions
# (#3258; rationale in `.cargo/mutants.toml`). This is the lane the issue
# caught red-handed: `parse_model_spec`'s whole diff produced two unviable
# mutants (`ProviderKind` has no `Default`) and the gate passed green.
# Mirrored verbatim by `mutation_gate_error_value` in the inference crate.
error_values = [
    'crate::InferenceError::InvalidSpec(String::from("mutated"))',
]

exclude_globs = [
    # `local`-gated execution: these files need cmake and model artifacts no CI
    # lane has, so they are not compiled here and their mutants are untestable
    # by construction — a mutant on non-compiled code always survives, and
    # vacuously. Their strength mechanism is the real-model integration suite
    # (`crates/inference/tests/local_integration.rs`), which runs only where a
    # llama.cpp build and the GGUF files are present.
    "crates/inference/src/llama/**",
    "crates/inference/src/embed.rs",
    "crates/inference/src/rank.rs",
    "crates/inference/src/provider/local.rs",
]

# Reasoned exclusions (regexes over mutant names).
#
# `runtime.rs` is a MIXED file: most of it compiles here, but its
# `#[cfg(feature = "local")]` items are in the position of the globbed files
# above — never compiled in this lane, so their mutants survive vacuously
# (cargo-mutants mutates source text without evaluating cfg: `--list` under
# `download,testkit` and under `download,testkit,local` is byte-identical).
#
# Those local-gated items are NO LONGER named here. #3254 replaced the
# hand-maintained list with `tools/mutants-cfg-filter`, which the CI lane runs
# as `--inactive-feature local`: it parses each survivor's source, evaluates
# every `#[cfg(..)]` predicate, and drops survivors inside a span that resolves
# to false for this lane. That covers every `local` item — including ones a
# diff has never touched (`with_ranking_engine`, `local_generation_engine`) —
# without a regex per function, and it can only ever drop a provably-inactive
# span, so it cannot mask a real survivor.
#
# What remains below is deliberately NOT what the filter handles: these are
# unviable or equivalent-program mutants in code this lane DOES compile, which
# a cfg-span filter cannot and must not touch.
exclude_re = [
    # #3436: three `-> Default::default()` replacements that can never compile,
    # in any build, because neither return type implements `Default` — proven
    # with a `needs_default::<T>()` probe, which fails to compile for both
    # `InferenceStatus` and `ConfigFileStatus`. These are not uncompiled or
    # equivalent: cargo-mutants simply has no viable replacement to write (the
    # same shape as a `MutexGuard` return, for which it likewise has none).
    #
    # Left in, they are a landmine rather than a gate: every one of these
    # functions is on a path a future diff will touch, and a diff whose lane-C
    # slice holds only these reports "generated mutants and not one compiled,
    # so the lane judged nothing" (#3337) — a red that says nothing about the
    # change. #3423 is where that first fired.
    #
    # Neither type should gain a `Default` to satisfy the tool: both are wire
    # DTOs, and a `ConfigFileStatus::default()` is an empty path — a value that
    # must never be reported as an answer, one `unwrap_or_default()` away from
    # being one.
    #
    # Strength mechanism: the facts these functions carry are pinned directly.
    # `status_reports_the_config_file_its_settings_read` walks all four states
    # through `InferenceRuntime::status` and asserts the reported path and
    # state (planting `config_file: None` in `status` reds it); the trait
    # default is pinned by `a_settings_source_that_reads_no_file_reports_none`,
    # which asserts `None` for the environment, for a platform with no config
    # directory, and for the capture runtime; and the fake's `status` is
    # replayed byte-for-byte by the `inference.status` response fixture and the
    # output-contract corpus.
    "replace InferenceRuntime::status -> InferenceStatus with Default::default\\(\\)",
    "replace ProviderSettings::config_file -> Option<ConfigFileStatus> with Some\\(Default::default\\(\\)\\)",
    "replace <impl crate::InferenceService for FakeInferenceService>::status -> crate::InferenceStatus with Default::default\\(\\)",
    # #3293 lock wait: `start.elapsed() < max_wait` compares against a clock,
    # so `<` and `<=` differ only when elapsed lands EXACTLY on the bound — a
    # boundary of measure zero on a continuous quantity. The two are
    # behaviourally identical, not merely hard to test.
    #
    # Everything the wait DECIDES is mutated and tested: `lock_is_stale` (a
    # truth table over absolute ages, so a moved threshold reds it),
    # `lock_wait_verdict` (both directions), and the loop itself through
    # `wait_out_lock_within`, whose bounds are injected so
    # `the_wait_gives_up_on_a_holder_that_never_releases` can watch it give up
    # in 120ms instead of ten minutes. Anchored to the function so it cannot
    # over-match a future comparison elsewhere.
    "replace < with <= in wait_out_lock_within",
    # `unload` folds "dropped anything?" across three caches with `|=`; two of
    # the three folds sit in its `local`-only block. This entry is name-scoped,
    # so it also covers the COMPILED `any(anthropic, openai, google)` fold —
    # which is pinned directly: planting `&=` there reds
    # `unload_reports_whether_it_dropped_a_cached_model`. It is kept until that
    # compiled fold is judged by the gate directly; the cfg filter would drop
    # the other two (local) folds on its own were this entry removed.
    "replace \\|= with &= in InferenceRuntime::unload",
    # `cached_generation_engine` IS compiled here (the cloud providers need
    # the generation cache) but is dead by control flow: its only caller sits
    # behind `!is_cloud()` on a *ready* model, and `resolve_local`'s
    # `!cfg!(feature = "local")` guard refuses every local run in this lane,
    # so the twin it calls, `local_generation_engine`, is `unreachable!` here.
    # A mutant in it (e.g. `delete !` on the cache probe) can only be
    # observed by a local run that reaches the loader — the same
    # `local,download` matrix cells as above.
    "\\bInferenceRuntime::cached_generation_engine\\b",
    # Two resolver guards whose mutants are *equivalent programs* in this
    # lane rather than uncompiled: `!cfg!(feature = "local")` is `true` here,
    # so "replace with true" changes nothing; and with every cloud provider
    # feature on (the crate's default), `!generation_provider_feature_enabled`
    # is `false` for each provider, so "replace with false" changes nothing.
    # Only a build that flips the feature can tell the mutant from the
    # original: the `local` lane for the first (#3267), a
    # `--no-default-features` lane for the second (no such lane exists; also
    # noted on #3267). The resolver's own tests pin both decisions in the
    # builds where they differ (`not_built_comes_before_not_downloaded` and
    # `cloud_checks_run_task_then_build_then_network_then_key` compute their
    # expectation from `cfg!`).
    "replace match guard !cfg!\\(feature = \"local\"\\) with true in resolve_local",
    "replace match guard !generation_provider_feature_enabled\\(provider\\) with false in resolve_cloud",
]
