# cargo-mutants configuration for LANE B of the mutation-on-diff CI gate:
# strata-executor, built with `--features idl-tooling,inference,testkit` — the
# same set the `test` job's IDL gates use, so feature-gated code (idl_tooling,
# the inference command surface) is compiled and its tests actually run instead
# of every mutant reporting a false MISSED.
#
# **Executor exclusions belong here, not in `.cargo/mutants.toml`.** This file
# is passed with `--config`, which replaces the default config rather than
# adding to it, so the default config never applies to this lane. See the
# partition table in `.cargo/mutants.toml`.

exclude_globs = [
    # The default-feature executor slice compiles the hub- and arrow-enabled
    # handlers; the inverse feature-disabled stubs are cfg-disabled here, so a
    # mutant on them is a no-op on non-compiled code and survives vacuously.
    # These are whole-file stubs, so they are excluded by PATH. (Their sibling,
    # `arrow_feature_disabled`, is a single cfg-gated fn inside a file that also
    # holds real code, so it is excluded by NAME below — never by line number:
    # line ranges rot and can swallow real code.)
    "crates/executor/src/executor/hub_disabled.rs",
    "crates/executor/src/executor/arrow_disabled.rs",
    "crates/executor/src/bin/**",
]

exclude_re = [
    # verify_case (idl_tooling::verify): the fixture-verifier orchestrator — it
    # reads every response fixture, replays it against a scratch executor, and
    # diffs. Its strength mechanism is the `verify-fixtures` CI gate (which runs
    # the REAL verify_case over the whole corpus and fails on any mismatch), not
    # a cargo test — cargo-mutants runs cargo tests, which by construction never
    # drive this file-reading/executing orchestrator, so a body-stub survives
    # vacuously (same doctrine as the REPL/serve/IPC glue below). #3112 masks the
    # wall-clock committed_at inside it, which pulled its whole-body mutant into
    # the diff. Excluded by NAME (unique; verify_error_case is a distinct name);
    # the pure helper it calls (mask_committed_at) stays mutated.
    "verify_case",

    # IPC transport (crates/executor/src/ipc): the entries below are the
    # residual equivalent/plumbing mutants the module's functional suite
    # (two-process round-trip, per-request scope, idle-timeout, non-contention
    # propagation, pid liveness, fnv1a goldens, RAII drop cleanup, frame-cap
    # pin) cannot distinguish. The decision LOGIC is extracted into pure
    # predicates with truth-table tests and stays mutated:
    # is_transient_accept_error / is_read_retry_error (accept and read error
    # classification), open_brokered's contention branch, and serve_one
    # (dispatch + scope).
    #
    #  - serialize/panic fallbacks that are unreachable in practice;
    "serialize_failure_envelope|internal_panic_error|static_wire_request_error",
    #  - the raw accept/read event-loop plumbing (connection-cap accounting
    #    needing 128 live sockets, log-only guards, and loop-condition mutants
    #    that only manifest as a hang);
    "in (listener_loop|handle_connection)",
    #  - IpcServer::stop's SIGTERM poll flag;
    "delete ! in IpcServer::stop",
    #  - broker_to_owner, the racy owner start/stop retry window (its
    #    per-iteration branches are timing-dependent and convergent);
    "Connection::broker_to_owner",
    #  - open_brokered's "any error retries" mutant, which merely defers a
    #    non-lock error one open attempt before re-surfacing it;
    "with true in Connection::open_brokered",
    #  - read_frame's inclusive-vs-exclusive cap boundary (distinguishing it
    #    requires a payload of exactly 64 MiB).
    "replace > with >= in read_frame",

    # The cfg-gated no-arrow stub described in exclude_globs above. Its real
    # behavior is covered by arrow_disabled_behavior.rs in the no-arrow
    # feature-matrix leg.
    "arrow_feature_disabled",

    # default_inference_runtime (inference_settings): the one runtime every
    # database opens with, over the executor's provider settings — the
    # environment, then the user config file at the PLATFORM path
    # (`strata config path`). Its only viable mutant, `Default::default()`,
    # is the env-only runtime, which every executor test is blind to: the two
    # differ only when a key is stored at the platform path, and an executor
    # test cannot place one there without mutating `HOME` in-process. The
    # composition itself (`EnvThenConfig`, `config_section`, `key_from_config`)
    # is over an injected path and stays fully mutated with truth tables. The
    # strength mechanism for the call site is the CLI's `config_behavior`
    # suite in lane A, which runs the real binary under a hermetic `HOME`
    # holding a stored key and asserts `inference status` names the file and
    # `doctor` sees the key: hand-verified by planting
    # `InferenceRuntime::default()` here — 2 tests red.
    "default_inference_runtime",
]
