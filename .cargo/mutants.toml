# cargo-mutants configuration for LANE A of the mutation-on-diff CI gate.
#
# The gate is PARTITIONED into three lanes (issue #2659), because cargo-mutants
# forwards `--features` to the per-package `cargo test` it runs for each mutant
# and feature names are package-local — `--features idl-tooling` is a hard error
# when the mutant under test is in strata-storage, so one global feature list
# cannot serve the workspace.
#
# **Each lane has its own config file, and this one is only lane A.**
#
#   | lane | packages                     | config                          |
#   |------|------------------------------|---------------------------------|
#   | A    | everything else, default     | `.cargo/mutants.toml` (here)    |
#   | B    | strata-executor              | `.cargo/mutants-executor.toml`  |
#   | C    | strata-inference             | `.cargo/mutants-inference.toml` |
#
# Lanes B and C are invoked with `--config <their file>`, which REPLACES this
# one rather than adding to it. So an exclusion written here has no effect
# whatsoever on an executor or inference mutant: put it in that lane's file.
# This is not a hypothetical — an exclusion for `embed_text_with` was added
# here, silently did nothing, and the same nine mutants survived two CI cycles.
# `mutation_partition_guard.rs` now fails on an exclusion that names a symbol
# its own lane cannot reach, so the mistake is caught at `cargo test` time.
#
# Keep the partition and ci.yml in sync: a package excluded here must have a
# lane of its own there, and vice versa — the guard asserts both directions.
exclude_globs = [
    "crates/executor/**",
    "crates/inference/**",
    # cfg(loom)-gated model-checking modules (TCP4.3): never compiled in this
    # lane, so their mutants survive vacuously. Their strength mechanism is the
    # loom CI job's own sabotage / should-panic twins. The *_loom.rs suffix is
    # the naming contract for loom model modules.
    "crates/storage/src/**/*_loom.rs",
    # The engine's fault/corruption injection scaffolding (#3156): the module is
    # `#[cfg(any(test, feature = "testkit"))]`, and every test that exercises it
    # opens with `#![cfg(feature = "testkit")]` — so under this lane's DEFAULT
    # features the module still compiles for the lib unit-test target while the
    # whole of `persistence_faults.rs` and its siblings compile away. Same
    # vacuous-survivor shape as the loom modules above, and the same class of
    # false MISSED this file's header describes for feature-gated code.
    #
    # These mutants are killable, just not here: planting
    # `FaultSchedule::take -> None` fails 6/6 of
    # `cargo test -p strata-engine --features testkit --test persistence_faults`,
    # which the `test` CI job runs. That is the strength mechanism.
    "crates/engine/src/persistence/fault.rs",
    # The DST simulation harness (TCP4.11): mutated to SATURATION during its
    # build-out — 25 mutants found across five gate rounds, every one killed
    # by the exact-facts pins it now carries (bit-exact trajectories make
    # every counter a constant of the seed, pinned at distinct values; action
    # histograms pin the grammar; truth tables pin labels/ids). The full-file
    # mutant set times out any per-PR budget (~200 mutants x ~90s of storage
    # suite), and the harness's strength mechanism — like the loom modules'
    # twins — is its own pins: a future edit that weakens an oracle fails the
    # pins loudly. Product code the harness CALLS stays fully mutated.
    "crates/storage/src/testkit/simulation/**",
    # The dual-mutation fuzz harness (TCP4.6c): same doctrine as the DST
    # simulation harness above — a checker whose strength mechanism is its
    # own falsification-verified pin suite (blinding the oracle verdict reds
    # the violation tests; dropping a damage write reds the byte-level
    # counter pins; four committed corpus seeds replay per-PR with exact
    # counters). The one full gate round it ran (PR #3014) timed out the
    # 90-minute budget mid-run — each mutant re-runs a storage suite whose
    # dual-mutation tests open real on-disk stores — after surfacing four
    # gaps, all resolved: the untested loud-refusal counter gained a
    # deterministic corrupted-manifest test, and the unreachable-by-
    # construction post-damage tolerance guard was DELETED (ops now run only
    # on claim-strict-verified Healthy stores, where refusals are loud).
    # Product code the harness calls stays fully mutated.
    "crates/storage/src/testkit/dual_mutation.rs",
]

# Reasoned equivalent-mutant exclusions (regexes over mutant names):
exclude_re = [
    # #2905 provenance mirror: `MemoryBudgetSource::from_storage` maps storage's
    # 3-variant StorageBudgetSource onto the engine mirror, plus a `_` fallback
    # forced by the source enum being #[non_exhaustive]. The fallback is
    # deliberately identical to the explicit FixedDefault arm (unknown future
    # provenance is reported as the fixed default), so deleting the explicit
    # FixedDefault arm is behavior-preserving — an equivalent mutant no test can
    # kill without an unconstructable unknown variant.
    "delete match arm StorageBudgetSource::FixedDefault.* in MemoryBudgetSource::from_storage",
    # #2998 REPL stdio glue: `print_banner` and `report_line_error` only relay
    # to stdout/stderr; their decision logic lives in the tested `banner_for`,
    # `banner_lines`, and `prefixed_error_line`. Stubbing the relays is
    # undetectable without capturing process stdio on an interactive-only
    # path, which in-process unit tests cannot do.
    "replace print_banner with \\(\\)",
    "replace report_line_error with \\(\\)",
    # W3.3 batching beat: a pure throughput heuristic — replacing the pause
    # with () is semantics-preserving by design (differently-batched fsyncs,
    # never fewer). No noise-free observer exists.
    "replace beat_pause with \\(\\)",
    # Commit-runtime contract checks (#2896): a check returns Ok(1) exactly
    # when it passes, so replacing its body with Ok(1) is observationally
    # equivalent to a healthy run. The healthy path is pinned by the
    # exact-counter contract tests; the checks' strength mechanism is their
    # failure path (which caught the W3.1c rot #2896 fixed). The decision
    # logic they evaluate is extracted into pure predicates with truth
    # tables (mixed_commit_counts_hold, gate_state_facts_hold) and the
    # record-payload verifier carries a direct mismatch-rejection test —
    # those all stay mutated.
    "replace check_(mixed_commit|timeline_rows_installed|version_gap_after_post_allocation_failure|applied_not_visible_gate) -> Result<usize, TestkitError> with Ok\\(1\\)",
    # BS5.4c parallel dispatch: the finish path's leader-applied fallback
    # (deliberate robustness for checkout failures, lifecycle bootstrap.rs)
    # makes a skipped dispatch semantics-equivalent — parallelism is a
    # latency property, pinned by the loom barrier model.
    "replace run_group_applies_parallel -> bool with false",
    # #2830: checkpoint timeline-group seeding is a FAST PATH with two
    # independent fail-safe healers (parentless branches scan-seed via
    # ensure_branch_timeline_complete; forked branches re-seed from the
    # parent chain via seed_forked_branch_timelines_from_parents), so
    # mutants that DROP or WIDEN the seeding are healed by design in every
    # row-preserving state — hand-verified: both survive their killer-shaped
    # tests because the healer rebuilds the coverage. The dangerous
    # direction — stale entries KEPT (the fence inversion) — cannot be
    # healed away and IS test-killed
    # (recreated_branch_refuses_dead_generation_timestamps_after_reopen).
    "replace seed_non_seeded_branch_timelines with \\(\\)",
    "replace && with \\|\\| in seed_non_seeded_branch_timelines",
    # IPC-CLI (#2842): the `&mut Executor` -> `&Connection` session migration
    # touched the signatures of three CLI functions that are untestable in CI
    # by construction, so their mutants survive vacuously (same category as the
    # loom/DST modules above). The logic they dispatch to IS unit-tested
    # (handle_message, handle_tool_call, validate_context, execute_parsed_command).
    #  - `mcp::serve`: a loop over the real process stdin; no seam feeds it lines.
    #  - `run_repl`: a rustyline editor loop that requires a TTY.
    #  - `run_clone`: a hub network round-trip (HubClone) no CI lane can reach,
    #    like the inference `local`-gated files excluded in run C.
    "replace serve -> Result<i32, CliError>",
    "run_repl",
    "run_clone",
    # strata update (#3038): the self-update GLUE is untestable in CI by
    # construction (same category as run_repl/run_clone above). It shells out
    # to curl/tar, does a release-network round-trip, and REPLACES the running
    # binary — a `cargo test` cannot let it overwrite the test runner, and no CI
    # lane has a fixtured release to point it at. The DECISION logic it
    # dispatches to IS unit-tested: decide, is_up_to_date, target_triple,
    # asset_name, expected_sha, sha256_file, hex, rejects_db_target,
    # check_exit_code. These names are unique in run A (verified), so the bare
    # matches do not over-exclude. Integration coverage (a file:// release
    # fixture) is the RFC's follow-up.
    #  - run_update: orchestrates download + checksum-verify + self-replace.
    #  - resolve_latest_version: a GitHub releases-API round-trip.
    #  - download / extract: curl / tar subprocesses.
    #  - replace_binary: renames a new binary over the running executable.
    "run_update",
    "resolve_latest_version",
    "replace_binary",
    # `download`/`extract` are generic names; \b-anchor so they match only the
    # bare glue functions, never a future `extract_foo`/`download_bar`.
    "\\bdownload\\b",
    "\\bextract\\b",
    "replace <impl Drop for TempDir>::drop with \\(\\)",
    # D8 download offer (#3124, #3261): `execute_with_download_offer` is the
    # process glue — is stdin a terminal, and the closure that binds the real
    # stdin and stderr to the question. A `cargo test` has no TTY, so its
    # mutants survive vacuously. Same category as run_repl and run_update
    # above.
    #
    # Everything it dispatches to stays mutated and has a test in this lane:
    # `offerable_download` (the truth table over terminal / output format /
    # the resolver's answer / not-a-pull) and `ask_for_download` (the answer
    # logic over injected streams: an explicit `y` and nothing else).
    "execute_with_download_offer",
    # `execute_offering_download` is the loop those two feed: refuse → ask →
    # pull → retry. Its one operator mutant, the `!` on the answer, is
    # killable — but only against a runtime whose refusal names a model that
    # a pull then makes present, and that runtime is the executor's fake,
    # behind `strata-cli/testkit`, which this lane's default-feature build
    # compiles out (the observers are `cfg(feature = "testkit")`). The `test`
    # job runs them: `cargo test -p strata-cli --features testkit --lib`.
    # Planting `delete !` there reds
    # `tests::the_offer_pulls_the_model_the_refusal_names_and_retries`
    # (declined answer pulls anyway; accepted answer refuses), verified by
    # hand. That is the strength mechanism this entry rests on. Same class as
    # `inference_report` below.
    "delete ! in execute_offering_download",
    # D2 install-local (#3124): the same self-replacing-binary glue already
    # excluded above for `strata update` — it downloads a release asset,
    # verifies its checksum and overwrites the running executable, which a test
    # runner cannot let it do. It shares `install_release_asset` with
    # `run_update`, whose pure parts (local_asset_name, expected_sha,
    # target_triple) stay mutated and are unit-tested.
    "run_install_local",
    # `has_local_execution` is `cfg!(feature = "inference-local")` and nothing
    # else. Its test asserts exactly that, but a test can only observe the
    # build it runs in: whichever constant the feature evaluates to in this
    # lane's build, the mutant returning that same constant is
    # indistinguishable from the original and survives; the other one is
    # caught. The survivor is an artefact of mutating a feature reflection,
    # not an untested branch.
    "has_local_execution",
    # `install_release_asset` is the shared body of `run_update` and
    # `inference install-local`, both already excluded above: download an
    # asset, verify its SHA-256, overwrite the running executable. Extracting
    # it gave the same untestable glue a new name. Its pure parts
    # (expected_sha, sha256_file, hex, asset_name, local_asset_name) stay
    # mutated and are unit-tested.
    "install_release_asset",
    # `doctor::inference_report` has two cfg variants, and cargo-mutants
    # mutates source text without evaluating cfg — so it also mutates the
    # `not(all(native, inference))` fallback, which THIS lane never compiles.
    # A vacuous survivor, same class as the loom modules and
    # persistence_faults.rs described above.
    #
    # The variant that does compile is tested: planting
    # `inference_report -> Default::default()` reds
    # `doctor::tests::the_inference_report_carries_facts`, verified by hand.
    # That is the strength mechanism this entry rests on.
    "replace inference_report -> Value with Default::default\\(\\)",
]
