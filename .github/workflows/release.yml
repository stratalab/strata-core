name: Release

on:
  push:
    tags: ["v*"]
  # Dry run (#3266): exercises format-gate, every build job and packaging on
  # any ref, without publishing. The `release` and `update-homebrew` jobs run
  # only for a tag push. The `-local` variant had never been built by this
  # workflow when it first broke — dispatch this before tagging, not after.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # strata-hub pins the stratahub crates by git rev; the repo is private.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  format-gate:
    # Release gate: the frozen durable format and the capability contract
    # must hold on the exact tagged commit — releases must not rely on
    # main having been green at some earlier point.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Frozen-format golden vectors
        run: cargo test --locked -p strata-storage --test format_golden
      - name: Capability contract
        run: cargo test --locked -p strata-engine --test capability_conformance

  # ---------------------------------------------------------------------------
  # 1. Build the strata binary per target (all native runners, no cross)
  # ---------------------------------------------------------------------------
  build:
    needs: format-gate
    name: Build strata (${{ matrix.target }}${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The lean default: cloud providers only, ~12 MB.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            variant: default
            suffix: ""
            features: ""
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            variant: default
            suffix: ""
            features: ""
          - target: aarch64-apple-darwin
            runner: macos-14
            variant: default
            suffix: ""
            features: ""
          # D2: the build `strata inference install-local` swaps in. Same
          # version, plus vendored llama.cpp for local GGUF execution. It is on
          # the release critical path on purpose: a release that cannot produce
          # the asset `install-local` promises is not ready to ship.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            variant: local
            suffix: "-local"
            features: "--features inference-local"
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            variant: local
            suffix: "-local"
            features: "--features inference-local"
          - target: aarch64-apple-darwin
            runner: macos-14
            variant: local
            suffix: "-local"
            features: "--features inference-local"

    steps:
      - uses: actions/checkout@v4
        with:
          # llama.cpp is a git submodule (`crates/inference/vendor/llama.cpp`);
          # a plain checkout leaves it empty and `crates/inference/build.rs`
          # refuses to build (#3266). Only the local variant compiles it.
          submodules: ${{ matrix.variant == 'local' }}
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: ${{ matrix.target }}
      # llama.cpp is built by cmake from the vendored source; only the local
      # variant needs it.
      - name: Install cmake (local variant)
        if: matrix.variant == 'local'
        run: |
          if command -v cmake >/dev/null 2>&1; then
            cmake --version
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install cmake
          else
            sudo apt-get update && sudo apt-get install -y cmake
          fi
      - name: Build release binary
        run: cargo build --release --locked -p strata-cli --target ${{ matrix.target }} ${{ matrix.features }}
      - name: Smoke-test the binary
        run: |
          BIN=target/${{ matrix.target }}/release/strata
          "$BIN" --version
          "$BIN" --cache ping
      - name: Confirm the variant is what it claims
        run: |
          BIN=target/${{ matrix.target }}/release/strata
          # `local_execution` is the field `install-local` and `status` act on;
          # shipping a "-local" asset that reports false would be the exact
          # class of defect #3124 was about.
          "$BIN" --cache inference status --json > status.json
          cat status.json
          if [ "${{ matrix.variant }}" = "local" ]; then
            grep -q '"local_execution":true' status.json
          else
            grep -q '"local_execution":false' status.json
          fi
      - name: Upload strata binary
        uses: actions/upload-artifact@v4
        with:
          name: strata-${{ matrix.target }}${{ matrix.suffix }}
          path: target/${{ matrix.target }}/release/strata

  # ---------------------------------------------------------------------------
  # 1b. Build the browser wasm bundle (cache-mode engine + the CLI parser),
  #     consumed by stratadb.org's /playground via fetch-from-release.
  # ---------------------------------------------------------------------------
  build-wasm:
    needs: format-gate
    name: Build wasm playground bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli (matching Cargo.lock)
        run: |
          VERSION="$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep version | head -1 | cut -d'"' -f2)"
          cargo install wasm-bindgen-cli --version "$VERSION" --locked
      - name: Build wasm bundle
        run: |
          cargo build --release --locked -p strata-wasm --target wasm32-unknown-unknown
          wasm-bindgen --target web \
            --out-dir crates/wasm/www/pkg \
            target/wasm32-unknown-unknown/release/strata_wasm.wasm
      - name: Package the wasm bundle
        run: tar czf strata-wasm-web.tar.gz -C crates/wasm/www/pkg strata_wasm.js strata_wasm_bg.wasm
      - name: Upload wasm bundle
        uses: actions/upload-artifact@v4
        with:
          name: wasm-web
          path: strata-wasm-web.tar.gz

  # ---------------------------------------------------------------------------
  # 2. Package archives (flat layout: strata + README at the root, matching
  #    the v0.6.x install.sh contract)
  # ---------------------------------------------------------------------------
  package:
    name: Package (${{ matrix.target }}${{ matrix.suffix }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
        suffix: ["", "-local"]

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            README.md
            LICENSE
            Cargo.toml
          sparse-checkout-cone-mode: false

      - name: Determine version
        id: version
        # A tag names the version. A dry run (workflow_dispatch) has only a
        # branch name, which may contain `/`, so it packages under the
        # workspace version instead.
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-dry-run" >> "$GITHUB_OUTPUT"
          fi

      - name: Download strata binary
        uses: actions/download-artifact@v4
        with:
          name: strata-${{ matrix.target }}${{ matrix.suffix }}
          path: staging

      - name: Package
        run: |
          chmod +x staging/strata
          cp README.md staging/
          # Apache-2.0 requires the license text to travel with the work, and
          # every tarball since v1.0.0 shipped without it (#3010). The sparse
          # checkout above must list LICENSE too, or this copy finds nothing.
          cp LICENSE staging/
          ARCHIVE_NAME="strata-v${{ steps.version.outputs.version }}-${{ matrix.target }}${{ matrix.suffix }}.tar.gz"
          tar czf "${ARCHIVE_NAME}" -C staging strata README.md LICENSE
          # Assert what the archive actually holds, the way the IDL docs bundle
          # below does. The pipeline was green for every release that shipped
          # without a license, because no job looked inside a tarball (#3010).
          tar tzf "${ARCHIVE_NAME}" | grep -qx 'LICENSE'
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}${{ matrix.suffix }}
          path: ${{ env.ARCHIVE_NAME }}

  # ---------------------------------------------------------------------------
  # 3. Create the GitHub Release with checksums
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [package, build-wasm]
    # Publishing is for tag pushes only; a dry run stops at packaging.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true

      # The browser wasm bundle (strata_wasm.js + strata_wasm_bg.wasm),
      # consumed by stratadb.org's /playground via fetch-from-release.
      - name: Download the wasm bundle
        uses: actions/download-artifact@v4
        with:
          name: wasm-web
          path: artifacts

      # The IDL-generated command reference (docs pages + command-index.json +
      # schemas), consumed by stratadb.org's fetch-from-release pipeline. The
      # tarball roots at `generated/`. Committed docs are drift-guarded by
      # check-docs, so at a release tag they match the shipped binary.
      - name: Package the IDL docs bundle
        # #3094: CHANGELOG.md rides inside `generated/`, beside the command
        # index. Whoever unpacks this bundle to adopt a new catalog is exactly
        # whoever needs to know how that catalog changed — a wire-visible error
        # reclassification in 1.2.0 was documented, shipped nowhere a consumer
        # could reach, and broke a downstream build anyway.
        run: |
          cp CHANGELOG.md crates/executor/idl/v1/generated/CHANGELOG.md
          tar czf artifacts/strata-idl-docs.tar.gz -C crates/executor/idl/v1 generated
          tar tzf artifacts/strata-idl-docs.tar.gz | grep -qx 'generated/CHANGELOG.md'

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum strata-v* strata-idl-docs.tar.gz strata-wasm-web.tar.gz > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          gh release create "${{ github.ref_name }}" \
            --title "Strata ${{ github.ref_name }}" \
            --generate-notes \
            strata-v*.tar.gz strata-idl-docs.tar.gz strata-wasm-web.tar.gz checksums-sha256.txt

  # ---------------------------------------------------------------------------
  # 4. Update the Homebrew tap
  # ---------------------------------------------------------------------------
  update-homebrew:
    name: Update Homebrew Tap
    needs: release
    # Skipped with `release` on a dry run; stated here so the gate is
    # visible on the job and not only inherited through `needs`.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256 for archives
        id: sha
        run: |
          cd artifacts
          echo "arm64=$(sha256sum strata-v${{ steps.version.outputs.version }}-aarch64-apple-darwin.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_x86_64=$(sha256sum strata-v${{ steps.version.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(sha256sum strata-v${{ steps.version.outputs.version }}-aarch64-unknown-linux-gnu.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: stratalab/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA_ARM64: ${{ steps.sha.outputs.arm64 }}
          SHA_LINUX_X86_64: ${{ steps.sha.outputs.linux_x86_64 }}
          SHA_LINUX_ARM64: ${{ steps.sha.outputs.linux_arm64 }}
        run: |
          cat > homebrew-tap/Formula/strata.rb <<'FORMULA'
          class Strata < Formula
            desc "Embedded database for the agent era: branch, time-travel, search"
            homepage "https://stratadb.org"
            version "VERSION_PLACEHOLDER"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/stratalab/strata-core/releases/download/vVERSION_PLACEHOLDER/strata-vVERSION_PLACEHOLDER-aarch64-apple-darwin.tar.gz"
                sha256 "SHA_ARM64_PLACEHOLDER"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/stratalab/strata-core/releases/download/vVERSION_PLACEHOLDER/strata-vVERSION_PLACEHOLDER-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "SHA_LINUX_ARM64_PLACEHOLDER"
              end
              on_intel do
                url "https://github.com/stratalab/strata-core/releases/download/vVERSION_PLACEHOLDER/strata-vVERSION_PLACEHOLDER-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "SHA_LINUX_X86_64_PLACEHOLDER"
              end
            end

            def install
              bin.install "strata"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/strata --version")
            end
          end
          FORMULA

          # Strip YAML indentation from the generated formula
          sed -i'' -e 's/^          //' homebrew-tap/Formula/strata.rb

          # Replace placeholders with actual values
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" homebrew-tap/Formula/strata.rb
          sed -i "s/SHA_ARM64_PLACEHOLDER/${SHA_ARM64}/g" homebrew-tap/Formula/strata.rb
          sed -i "s/SHA_LINUX_X86_64_PLACEHOLDER/${SHA_LINUX_X86_64}/g" homebrew-tap/Formula/strata.rb
          sed -i "s/SHA_LINUX_ARM64_PLACEHOLDER/${SHA_LINUX_ARM64}/g" homebrew-tap/Formula/strata.rb

      - name: Commit and push formula update
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/strata.rb
          git commit -m "Update strata to v${{ steps.version.outputs.version }}"
          git push
