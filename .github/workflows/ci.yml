name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # strata-hub pins the stratahub crates by git rev and that repo is
  # private, so every cargo resolve needs read access. Fetch through the
  # git CLI so the token below applies.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        # Fine-grained PAT with Contents: read on stratalab/stratahub.
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy with features enabled
        # The step above lints DEFAULT features only, so everything behind a
        # feature flag went unlinted — `testkit`, `fault-injection`,
        # `idl-tooling`, the lot. `feature-matrix` does walk the powerset, but
        # with `check` rather than `clippy` and without `--all-targets`, so it
        # never compiled a test file either. Between them, 21 lints had rotted
        # invisibly (#3437), including dead harnesses and mis-gated helpers.
        #
        # One invocation per crate at its full light feature set. The heavy
        # ones are excluded for build cost, not by principle: `local`/
        # `inference-local` need a llama.cpp cmake build and `differential`
        # needs RocksDB — `local` is #3267's problem, and both are nightly's.
        run: |
          set -e
          specs=(
            "-p strata-core --all-features"
            "-p strata-storage --all-features"
            "-p strata-engine --all-features"
            "-p strata-hub --all-features"
            "-p strata-gpu-cache --all-features"
            "-p stratadb --all-features"
            "-p strata-inference --features anthropic,download,google,openai,testkit,wire-schemas"
            "-p strata-executor --features arrow,hub,idl-tooling,inference,inference-anthropic,inference-google,inference-openai,ipc,jsonschema,localfs,testkit"
            "-p strata-cli --features cloud,inference,inference-anthropic,inference-google,inference-openai,native,testkit"
            # #3302: the MINIMAL CLI shape. Every other spec lints a maximal
            # feature set, so an item that exists only for `inference` but is
            # not gated on it rots invisibly (six had, one a hard clippy
            # error) — this is the only spec where those gates are load-
            # bearing. feature-matrix `check`s this shape but never lints it.
            "-p strata-cli --no-default-features --features native"
          )
          for spec in "${specs[@]}"; do
            echo "::group::clippy $spec"
            cargo clippy --locked $spec --all-targets -- -D warnings
            echo "::endgroup::"
          done
      - name: Lockfile consistency
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Advisory + license + source check
        run: cargo deny check
      # Dependency-direction (DAG) enforcement lives in workspace guard
      # tests (crates/*/tests/dependency_guard*.rs, storage source guards)
      # and runs with the test job.

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Workspace tests
        # gpu-cache device tests are #[ignore]d and skip without a GPU;
        # its host-sim suites run here.
        run: cargo test --locked --workspace
      - name: Conformance gates
        # Frozen-format and capability-contract harnesses, named so a
        # failure is visible as its own step.
        run: |
          cargo test --locked -p strata-storage --test format_golden
          cargo test --locked -p strata-engine --test capability_conformance
          # #3290: ten engine test files are testkit-gated (five whole-file,
          # five item-level) — 809 tests that no default-features run
          # compiles. The #3437 clippy matrix LINTS this shape; this is the
          # lane that RUNS it.
          cargo test --locked -p strata-engine --features testkit
          # Standalone (no `hub` in the graph), so serde_json's `float_roundtrip`
          # is whatever the workspace declares rather than whatever `serde_jcs`
          # happens to unify in. The whole-workspace run above cannot fail if
          # that feature is dropped; this one can (#3188).
          cargo test --locked -p strata-engine --test engine_event
      - name: Executor IDL drift gates
        run: |
          cargo run --locked -p strata-executor --features idl-tooling,inference,testkit --bin strata-idl -- check
          cargo run --locked -p strata-executor --features idl-tooling,inference,testkit --bin strata-idl -- check-cli
          cargo run --locked -p strata-executor --features idl-tooling,inference,testkit --bin strata-idl -- check-docs
          cargo run --locked -p strata-executor --features idl-tooling,inference,testkit --bin strata-idl -- check-tests
          cargo run --locked -p strata-executor --features idl-tooling,inference,testkit --bin strata-idl -- verify-examples
          cargo run --locked -p strata-executor --features idl-tooling,inference,testkit --bin strata-idl -- verify-fixtures
      - name: Executor feature-gated tests
        # #3317: EVERY executor integration target under the full light
        # feature set — never a hand-kept `--test <name>` list. That list was
        # a copy of the `#![cfg]` attributes in crates/executor/tests/ and
        # rotted twice: three targets (22 tests) were never added, and
        # idl_response_model had to be added by hand after the issue was
        # filed. A new gated target is covered the day it lands. The
        # executor's default-feature targets run twice per PR (workspace step
        # + here); the suite is small and the doubled minutes buy the
        # impossible-to-forget property.
        run: cargo test --locked -p strata-executor --features idl-tooling,inference,testkit --tests
      - name: Inference feature lanes (offline)
        # The download module and the deterministic testkit are feature-gated
        # and invisible to the default workspace run; both are offline and
        # fast. Real provider/GGUF behavior stays in the gated nightly lanes.
        # The CLI's download-offer tests drive the executor's fake runtime
        # and sit behind the CLI's own `testkit` feature for the same reason.
        run: |
          cargo test --locked -p strata-inference --features download,testkit --lib
          cargo test --locked -p strata-cli --features testkit --lib
      - name: Doc tests
        run: cargo test --locked --workspace --doc

  feature-matrix:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - name: Feature powerset check
        # Excluded: `local`/`inference-local` (llama.cpp cmake build),
        # `ingest` (cross-repo executor pin, covered by hub-ingest),
        # `python` (pyo3 link), `differential` (RocksDB C++ build; its
        # lane runs nightly).
        run: >
          cargo hack --locked --feature-powerset --depth 2
          --exclude-features local,inference-local,ingest,python,differential
          check --workspace
      - name: Feature lint (each feature, all targets)
        # The powerset above runs `check` and, crucially, WITHOUT
        # `--all-targets` — so it compiles each crate's lib and never a test
        # file. `check`'s own clippy step lints only DEFAULT features. Between
        # them, no lane had ever compiled a test target off the default
        # feature set, and 58 compile errors plus ~60 lints had rotted in that
        # gap (#3446, following #3437).
        #
        # `--each-feature` rather than `--feature-powerset`: linear in the
        # number of features instead of exponential, ~1 minute here against
        # the powerset's many, and it catches this entire class — every fix in
        # #3446 was found by exactly this invocation. The same exclusions
        # apply, for the same build-cost reasons.
        #
        # `--all-targets` sits AFTER `clippy`: cargo-hack forwards trailing
        # flags to the subcommand, and placed before it the flag reaches
        # `cargo` itself, which rejects it.
        run: >
          cargo hack --locked --each-feature
          --exclude-features local,inference-local,ingest,python,differential
          clippy --workspace --all-targets -- -D warnings

  hub-ingest:
    # The stratahub-facing surface their ingest CLI compiles against:
    # `ingest` pulls stratahub-ingest, whose metadata layer pins
    # strata-executor at the blessed engine-swap SHA (a second, older
    # executor build — expected, not a conflict).
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Hub tests with ingest enabled
        run: cargo test --locked -p strata-hub --features ingest

  fault-injection:
    # The storage fault-injection integration targets (#2902): every test in
    # them is filtered out without the feature flag, so no other lane can see
    # them — three latent reds rotted invisibly this way (#2848, #2896,
    # #2902), each a testkit contract that silently fell behind an
    # intentional lib change. This lane keeps that class per-PR-visible.
    # The deep soaks stay nightly; this runs the deterministic contracts.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Storage fault-injection suite
        run: cargo test --locked -p strata-storage --features fault-injection

  perf-gates:
    # TCP5.2: instruction-count ceilings over the shipping paths. Callgrind
    # counts are deterministic (~0.02% observed spread; benchmarks/README.md)
    # and hardware-independent, so committed ceilings can block merges
    # without flapping. Ceilings live in scripts/perf_floors.py, pinned to
    # the workspace toolchain; the benches live in the out-of-workspace
    # benchmarks/ crate.
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmarks
      - name: Install valgrind
        uses: ./.github/actions/apt-install
        with:
          packages: valgrind
      - uses: taiki-e/install-action@v2
        with:
          tool: iai-callgrind-runner@0.16.1
      - name: Instruction-count benches
        working-directory: benchmarks
        run: |
          cargo bench --locked --bench storage_commit -- --save-summary=json
          cargo bench --locked --bench storage_reopen -- --save-summary=json
          cargo bench --locked --bench wire_commands -- --save-summary=json
      - name: Perf ceilings gate
        run: python3 scripts/perf_floors.py --iai-root benchmarks/target/iai

  loom:
    # TCP4.3: exhaustive schedule exploration of the write-group protocol
    # (commit_group.rs) under loom. Fully deterministic — every schedule at
    # the model bounds is explored, so this can block merges without
    # flapping. The --cfg loom build swaps the storage sync seam
    # (crates/storage/src/sync.rs) to loom primitives; the separate cache
    # key keeps the differently-flagged dep tree warm.
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: loom
      - name: Schedule-exploration models
        env:
          RUSTFLAGS: --cfg loom
        run: cargo test --locked -p strata-storage --lib -- commit_group_loom visibility_loom

  mutation-on-diff:
    # SQLite-style suite-strength gate, bounded to stay affordable: mutate
    # only the lines this PR touches; an un-killed mutant is a missing
    # assertion. Doc/test-only diffs produce no mutants and pass trivially.
    # 90 minutes: a large single-behavior storage diff (#2769, ~150 product
    # lines) produced more mutants than the original hour fit at ~110s per
    # mutant; the gate must be able to finish judging before it can gate.
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    # Eight shards (#3314): a lane-B (executor) mutant costs ~140s here —
    # baseline build plus one test run each — so a ~200-mutant IDL-tooling
    # diff needs ~7 hours serially, past the 6-hour job cap, never mind the
    # 90 minutes below. Each shard judges every eighth mutant of every lane
    # (round-robin, so a heavy file is spread rather than landing on one
    # shard); a lane with no mutants in a shard exits before its baseline
    # build, so small diffs still pay for roughly one build. Add shards
    # before raising the timeout: a shard's clock is the gate's latency.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    # 90 minutes (#2770): sized for product diffs. The DST harness modules
    # are mutation-excluded at saturation (see .cargo/mutants.toml) — their
    # full-file mutant set outgrew any per-PR budget and their strength
    # mechanism is their own exact-facts pins.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-mutants
      - name: Mutants on the PR diff
        # Partitioned into three lanes (#2659): feature names are
        # package-local, so one global --features list cannot serve the
        # workspace. Lane A covers every package except executor/inference
        # under default features; lanes B and C cover those two packages under
        # the same feature sets the test job uses, so feature-gated code
        # (idl_tooling, the inference command surface, download) is compiled and
        # its tests actually run instead of reporting false MISSED.
        #
        # Each lane's EXCLUSIONS live in its own config file — the rationale for
        # every entry is there, beside the entry. `--config` replaces the default
        # config rather than adding to it, so a lane reads its file and nothing
        # else; `.cargo/mutants.toml` is lane A's file, not a shared one.
        #
        # A lane whose slice of the diff has no mutants exits immediately, so
        # single-crate PRs pay for one lane. Sharding applies per invocation,
        # to that lane's own filtered list, so every lane is spread across
        # the eight shards independently.
        #
        # A lane's verdict is read off `mutants.out/missed.txt`, never off the
        # exit code, and `scripts/mutation-verdict.sh` is the one place that
        # reads it. cargo-mutants reports timeout AHEAD of missed, so exit 3
        # is also what a run returns when it hung on one mutant and left others
        # alive — which used to pass, handing a free pass on every missed
        # mutant to any PR whose diff carried a hanging mutant (#3225). The
        # decision lives in a script so a test can run it; see
        # crates/storage/tests/mutation_gate_verdict.rs.
        #
        # A lane that builds mutants and finds none of them viable tested
        # NOTHING, and cargo-mutants exits 0 for it — the failure mode #3337
        # was filed for, where eight green shards meant eight shards that
        # judged nothing. cargo-mutants says so itself ("No mutants were
        # viable"), and a lane with no mutants at all never says it, so that
        # line is the signal. Loud beats silent: a gate that proved nothing
        # must not read the same as one that proved everything.
        #
        # But that line is emitted per *invocation*, which is per shard slice,
        # so a shard cannot tell the lane-wide failure from its own eighth of
        # a small diff happening to hold one mutant that does not compile
        # (#3349). Each shard therefore only records a verdict per lane; the
        # `mutation-vacuity` job below judges the lane once the whole run's
        # evidence is in.
        run: |
          set +e
          git diff "origin/${{ github.base_ref }}"...HEAD > pr.diff
          common=(--in-diff pr.diff --timeout-multiplier 2.5 --minimum-test-timeout 60
                  --shard ${{ matrix.shard }}/8 --sharding round-robin)
          check() {
            cat "mutants-$1.log"
            # Recorded before any exit: a shard that stops on a missed mutant
            # has still judged its lane, and leaving without saying so would
            # let `mutation-vacuity` report that lane as having judged nothing.
            if grep -q "No mutants were viable" "mutants-$1.log"; then
              echo "$1 unviable" >> lane-verdicts.txt
            elif grep -qE "^Found [1-9]" "mutants-$1.log"; then
              echo "$1 viable" >> lane-verdicts.txt
            else
              echo "$1 none" >> lane-verdicts.txt
            fi
            scripts/mutation-verdict.sh "$1" "$2" || exit $?
          }
          # Each lane clears mutants.out first: nothing else does, and a lane
          # whose slice holds no mutants exits 0 without touching the directory,
          # so the next lane would read the previous lane's missed.txt as its
          # own verdict.
          rm -rf mutants.out
          cargo mutants "${common[@]}" > mutants-a.log 2>&1
          check a $?
          rm -rf mutants.out
          cargo mutants "${common[@]}" \
            --config .cargo/mutants-executor.toml \
            --package strata-executor \
            --features idl-tooling,inference,testkit > mutants-b.log 2>&1
          check b $?
          rm -rf mutants.out
          cargo mutants "${common[@]}" \
            --config .cargo/mutants-inference.toml \
            --package strata-inference \
            --features download,testkit > mutants-c.log 2>&1
          check c $?
      - name: Upload mutants report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: mutants.out
          retention-days: 30
      - name: Upload lane verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-lane-verdicts-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: lane-verdicts.txt
          if-no-files-found: ignore
          retention-days: 7

  mutation-vacuity:
    # The half of the #3337 guard that only the whole run can decide: a lane
    # that generated mutants and found not one of them viable judged nothing,
    # however green its shards look. A single shard cannot tell that from its
    # own slice being one mutant that does not compile (#3349), so the verdict
    # is taken here, where every shard's evidence is present.
    #
    # `always()` so a lane cannot escape judgment by having one shard fail for
    # an unrelated reason; a missed mutant still fails in the shard that found
    # it, and this job stays silent about it.
    if: always() && github.event_name == 'pull_request'
    needs: mutation-on-diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-lane-verdicts-${{ github.run_id }}-shard-*
          merge-multiple: false
          path: verdicts
      - name: Judge each lane across every shard
        run: |
          set -euo pipefail
          if [ ! -d verdicts ]; then
            echo "no shard reported a verdict; the shards did not get far enough to judge"
            exit 0
          fi
          cat verdicts/*/lane-verdicts.txt > all-verdicts.txt || true
          sort -u all-verdicts.txt || true
          failed=0
          for lane in a b c; do
            if grep -qx "$lane viable" all-verdicts.txt; then
              echo "lane $lane: judged at least one viable mutant"
            elif grep -qx "$lane unviable" all-verdicts.txt; then
              echo "::error::lane $lane generated mutants for this diff and not one of them compiled, so the lane judged nothing (#3337). Spell the return type out as Result<T, E> rather than a crate alias; if the type IS spelled out but its payload or error type has no Default, add the error type to that lane config's error_values (#3258, with its mirror test); or add a reasoned exclusion to that lane's config."
              failed=1
            else
              echo "lane $lane: no mutants in this diff"
            fi
          done
          exit "$failed"

  wasm:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen test runner
        uses: taiki-e/install-action@v2
        with:
          # Pinned to the wasm-bindgen version in Cargo.lock — the runner
          # refuses a version mismatch, so bumps must move in lockstep.
          tool: wasm-bindgen-cli@0.2.118
      - name: Clippy for the browser target
        # wasm compiles a different cfg of executor and cli — `hub` off,
        # `native` off — and nothing linted it, so unused imports and
        # unreachable items accumulated there unseen (#3437).
        run: cargo clippy --locked -p strata-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Browser target tests
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --locked -p strata-wasm --target wasm32-unknown-unknown

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - name: MSRV check
        # Lib/bin targets only: MSRV is a promise about what users compile.
        # Dev-only dependencies (test servers, conformance stacks) may
        # require newer compilers and build under the pinned toolchain.
        run: cargo check --locked --workspace

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        run: cargo build --locked --release --workspace
