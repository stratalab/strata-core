name: Nightly deep checks

# Heavy bug-finding lanes that are too expensive for per-PR CI: Miri,
# sanitizers, the coverage baseline, and release-mode tests. Per-PR CI
# (ci.yml) runs the debug-assertions leg of the 3-way suite run; this
# workflow runs the release and coverage legs.
#
# These lanes exist to break Strata, not to stay green. A red run here
# is a finding: file it, minimize it, and land the regression test with
# the fix.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  memory-safety-miri:
    # Undefined-behavior hunt on the unsafe-free crates. Strict
    # provenance turns pointer-integer sloppiness into hard errors.
    # Proptest case counts are lowered because Miri interprets, not
    # compiles; nightly budget covers core fully plus the storage
    # format layer (the pure decoders where UB would be durable-format
    # corruption).
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Miri strata-core
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-disable-isolation
          PROPTEST_CASES: "8"
        run: cargo +nightly miri test -p strata-core
      - name: Miri strata-storage format layer
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-disable-isolation
          PROPTEST_CASES: "8"
        run: 'cargo +nightly miri test -p strata-storage --lib format::'

  # Sanitizer jobs run --tests (lib + integration binaries) only:
  # rustdoc links doctests against sanitized rlibs without the ASAN
  # runtime and the link fails. Doctests run unsanitized in per-PR CI.
  memory-safety-address-sanitizer:
    # ASAN + LSAN (leak checking is on by default on Linux) across the
    # full storage suite — the crate that owns real syscalls and byte
    # handling. build-std instruments std itself so there are no
    # uninstrumented holes.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: ASAN + LSAN storage tests
        # Intentional fixture leaks go through testkit::leak_static /
        # forget_registered, which keep them reachable from a process
        # global — so every leak LSAN reports here is a real one. Bare
        # Box::leak/mem::forget in storage test code will show up as a
        # red run; route new fixtures through the registry instead.
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: cargo +nightly test --tests -Zbuild-std --target x86_64-unknown-linux-gnu -p strata-storage
      - name: ASAN + LSAN engine tests
        # Engine has no intentional fixture leaks, so LSAN (on by
        # default with ASAN on Linux) is a real leak gate here.
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: cargo +nightly test --tests -Zbuild-std --target x86_64-unknown-linux-gnu -p strata-engine

  memory-safety-thread-sanitizer:
    # TSAN over the threaded crates (TCP4.13b widened this from
    # storage-only): storage owns commit guards, maintenance scheduling,
    # and close ordering; engine adds the fork/COW and open-contention
    # threads; executor rides its threaded integration paths. Slow
    # (5-15x), which is why it lives here and not per-PR. tokio's
    # IO-driver internals are suppressed as a known TSan false positive
    # (.tsan-suppressions); Strata-frame races still fail the lane.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TSAN_OPTIONS: suppressions=${{ github.workspace }}/.tsan-suppressions
      # #2803: TSan runs 5-15x slower than native; the hub transport's 30s
      # wall-clock default expires on legitimate mock-hub round trips.
      STRATA_HUB_TIMEOUT_SECONDS: "180"
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: TSAN storage tests
        env:
          RUSTFLAGS: -Zsanitizer=thread
        run: cargo +nightly test --tests -Zbuild-std --target x86_64-unknown-linux-gnu -p strata-storage
      - name: TSAN engine tests
        env:
          RUSTFLAGS: -Zsanitizer=thread
        run: cargo +nightly test --tests -Zbuild-std --target x86_64-unknown-linux-gnu -p strata-engine
      - name: TSAN executor tests
        env:
          RUSTFLAGS: -Zsanitizer=thread
        run: cargo +nightly test --tests -Zbuild-std --target x86_64-unknown-linux-gnu -p strata-executor

  failure-during-failure-soak:
    # Compound-anomaly bug hunt: a second fault injected during crash
    # recovery and inside maintenance publish transitions, every case
    # verified against the recovery oracle. The bounded grid runs per-PR
    # via the in-crate unit tests; this lane runs the full integration
    # grid plus a deep multi-seed soak.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Write-ordering watchdog
        run: cargo test --locked -p strata-storage --features fault-injection --test write_ordering
      - name: Process-crash kill/reopen soak
        env:
          STRATA_STORAGE_PROCESS_CRASH_ROUNDS: "200"
        run: cargo test --locked -p strata-storage --lib process_crash_soak -- --ignored
      - name: Compound fault grid
        run: cargo test --locked -p strata-storage --features fault-injection --test compound_faults
      - name: Compound fault soak
        env:
          STRATA_STORAGE_COMPOUND_CASES: "20000"
        run: cargo test --locked -p strata-storage --features fault-injection --test compound_faults -- --ignored
      - name: Config differential soak
        run: cargo test --locked -p strata-storage --lib config_differential -- --ignored --skip pressure_retries_are_invisible_to_readers
      - name: Background scheduler liveness (perf-trace)
        # The closed-loop endurance suite is perf-trace gated and therefore
        # invisible to per-PR CI (default features); this is its only lane.
        run: cargo test --locked -p strata-storage --features perf-trace --lib background_scale

  storage-soak-lanes:
    # The deep #[ignore] bug-hunt lanes that predate the program (fault
    # sweeps, FS-persistence models, deterministic simulation) plus the
    # env-scaled crash and stress grids. These existed as code with no
    # automated tier — the audit's "a suite CI never runs does not exist"
    # finding; this job is their tier. Soaks use their own in-file nightly
    # defaults unless the env below overrides them.
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      # TCP5.1 liveness budgets: every soak step carries its own wall-time
      # budget (generous 10x+ over observed timings) so one wedged step fails
      # in bounded time instead of eating the whole 240-minute job — #2792
      # sat silent for 3h41m behind exactly this gap. The stress lane also
      # carries an in-test progress watchdog that fails a hard stall within
      # its 120s window and dumps per-session positions plus a
      # CPU-during-stall discriminator.
      - name: Fault sweep and FS-model soaks
        timeout-minutes: 45
        env:
          STRATA_STORAGE_FAULT_CASES: "10000"
        run: |
          cargo test --locked -p strata-storage --features fault-injection --test fault_sweep -- --ignored
          cargo test --locked -p strata-storage --features fault-injection --test recovery_read_faults -- --ignored
          cargo test --locked -p strata-storage --features fault-injection --test fs_persistence_models -- --ignored
      - name: Deterministic-simulation soaks
        timeout-minutes: 45
        # No env override: simulation cases are ~10x costlier per case, and
        # the in-file soak default (2,000) is the calibrated nightly budget.
        # The whole-DB target runs its SMOKE tier (seeds 0-5) here; the deep
        # whole-DB soak is the dedicated TCP4.11c step below.
        run: |
          cargo test --locked -p strata-storage --features fault-injection --test simulation_smoke -- --ignored
          cargo test --locked -p strata-storage --features fault-injection --test simulation_faults -- --ignored
          cargo test --locked -p strata-storage --features fault-injection --test simulation_whole_db
      # TCP4.11c: the whole-DB soak — WIDE (2,000 canonical 3x24 seeds,
      # ~0.4 s/seed) then DEEP (400 seeds at the 6x48 geometry, ~1.4 s/seed;
      # the deepened shape reaches recovery/maintenance interleavings the
      # canonical shape practically cannot — its first preflight multiplied
      # the failure rate 12x). Landed born-green after the #2828 and #2859
      # fix waves: canonical 0-1999 and deep 0-399 all clean on the exact
      # invocations below. A failure prints a one-line seeded repro carrying
      # the shape knobs — paste it verbatim to reproduce bit-exact locally.
      - name: Whole-DB soak (TCP4.11c)
        timeout-minutes: 90
        run: |
          STRATA_STORAGE_FAULT_CASES=2000 cargo test --locked -p strata-storage --features fault-injection --test simulation_whole_db -- whole_db_simulation_soak_deepens_across_many_seeds --ignored
          STRATA_SIM_EPOCHS=6 STRATA_SIM_STEPS_PER_EPOCH=48 STRATA_STORAGE_FAULT_CASES=400 cargo test --locked -p strata-storage --features fault-injection --test simulation_whole_db -- whole_db_simulation_soak_deepens_across_many_seeds --ignored
      - name: Elle lineage-history soak (TCP4.12a)
        timeout-minutes: 20
        # The single-session lineage/temporal history lane: seeded fork-chain
        # trajectories (incl. fork-of-a-fork) recorded as observed histories
        # and checked OFFLINE against an independent reconstruction of the
        # expected reads (elle's model) plus a version-monotonicity secondary
        # oracle. Per-PR CI runs a small sweep via the workspace lib tests;
        # this is the soak tier (~0.18 s/seed). A failure names its seed for a
        # bit-exact `run_lineage_history(seed=..)` replay.
        env:
          STRATA_LINEAGE_SEEDS: "400"
        run: cargo test --locked -p strata-storage --features fault-injection --lib lineage_history_soak -- --ignored --nocapture
      - name: Elle concurrent-history soak (TCP4.12b)
        timeout-minutes: 20
        # The concurrent read-atomicity lane: many writers commit atomic linked
        # batches while readers take single-snapshot multi-key reads, recorded
        # and checked OFFLINE for fractured/torn reads (the #2682 class, verified
        # sound by loom 4.3) and phantom values. Interleaving is the fuzzed
        # dimension; the invariant is interleaving-independent. Per-PR CI runs a
        # small workload via the workspace lib tests; this is the soak tier.
        env:
          STRATA_CONCURRENT_HISTORY_WRITERS: "6"
          STRATA_CONCURRENT_HISTORY_READERS: "6"
          STRATA_CONCURRENT_HISTORY_OPS: "2000"
        run: cargo test --locked -p strata-storage --lib concurrent_history_soak -- --ignored --nocapture
      - name: Config-invariance cross-product soak, debug-assert tier (TCP4.5c)
        timeout-minutes: 30
        # The config × capability × operation cross-product against the full
        # 6-config matrix (cache/durable × Standard/Always × default/64MiB
        # budget), with mid-script probes and every read-back compared for
        # equality across configs. This tier stays on the debug-assert build
        # (charter gate 8(b)) so internal-invariant trips fire as findings;
        # the NINE-FIGURE deep tier of the same soak runs in the
        # release-mode-tests job below. The floor trips if a mix change
        # silently deflates mutation volume. A failure names its seed.
        env:
          STRATA_CONFIG_SEEDS: "8"
          STRATA_CONFIG_OPS: "1500"
          STRATA_CONFIG_MUTATION_FLOOR: "4000000"
        run: cargo test --locked -p strata-executor --test config_invariance config_invariance_soak -- --ignored --nocapture
      - name: Crash-recovery deep grids
        timeout-minutes: 60
        env:
          STRATA_STORAGE_CRASH_CASES: "5000"
        run: |
          cargo test --locked -p strata-storage --features testkit --test crash_recovery
          cargo test --locked -p strata-storage --features testkit --test crash_recovery_oracle
      - name: Extended stress
        timeout-minutes: 30
        env:
          STRATA_STORAGE_STRESS_SECONDS: "120"
        run: cargo test --locked -p strata-storage --features testkit --test stress
      - name: Concurrent shared-database stress (TCP4.13a)
        timeout-minutes: 45
        # The randomized concurrent-session lane at soak scale: more
        # sessions, deeper op streams, several seeds. Per-PR CI runs the
        # same test at its small in-file defaults via the workspace suite.
        env:
          STRATA_STRESS_SESSIONS: "8"
          STRATA_STRESS_OPS: "1500"
        run: |
          for seed in 1 2 3 4; do
            STRATA_STRESS_SEED="$seed" cargo test --locked -p strata-storage --lib stress_random -- --nocapture
          done

  coverage-baseline:
    # Publishes per-crate region/line coverage. Baseline only for now:
    # the merge-blocking threshold gate is a later slice, and per the
    # program charter thresholds ratchet up, never down.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Workspace coverage
        run: |
          cargo llvm-cov --locked --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage-summary.txt
          cargo llvm-cov report > coverage-per-file.txt
          {
            echo '## Workspace coverage'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Per-crate product-only coverage floor gate
        # TCP3.0: supersedes the workspace-mixed floor. Product code only
        # (testkit/test infra excluded — the raw workspace number
        # understates storage by 16 points); floors and their ratchet
        # discipline live in scripts/coverage_floors.py.
        run: |
          set -o pipefail
          python3 scripts/coverage_floors.py coverage-per-file.txt | tee coverage-floors.txt
          {
            echo '## Per-crate product-only coverage'
            echo '```'
            cat coverage-floors.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifacts
        # always(): a floor-gate failure is exactly when the artifacts are
        # needed — #2764 was undiagnosable from CI because every red night
        # skipped this step.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            lcov.info
            coverage-summary.txt
            coverage-per-file.txt
            coverage-floors.txt
          retention-days: 90

  release-mode-tests:
    # The release leg of the 3-way suite run: debug_assertions off,
    # optimizations on. Catches release-only miscompiles/UB symptoms
    # and any correctness that hides behind debug_assert!.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Workspace tests (release)
        run: cargo test --locked --release --workspace
      - name: Config-invariance deep soak, nine-figure tier (TCP4.5c)
        # The deep tier of the config-invariance cross-product: 48 seeds ×
        # 5000-op scripts × 6 configs at ~70 mutations/op ≈ 1.0e8 applied
        # mutations (measured 28K mutations/sec in release; ~60 min local).
        # Release-mode is what makes nine figures affordable, and this job
        # is the charter's sanctioned no-assert leg — the debug-assert tier
        # of the same soak runs in the main nightly job above. The low
        # budget rides at 256MiB because deep append-heavy scripts grow the
        # LIVE set past 64MiB — cache mode refuses commits past its budget
        # by contract — while 256MiB still forces pressure-driven
        # maintenance. The floor trips if a mix change silently deflates
        # the volume. A failure names its seed.
        env:
          STRATA_CONFIG_SEEDS: "48"
          STRATA_CONFIG_OPS: "5000"
          STRATA_CONFIG_LOW_BUDGET_MIB: "256"
          STRATA_CONFIG_MUTATION_FLOOR: "100000000"
        run: cargo test --locked --release -p strata-executor --test config_invariance config_invariance_soak -- --ignored --nocapture
      - name: Release binary size ratchet (TCP5.2)
        # The test step above already built the release dep graph, so this
        # build is nearly free; the ceiling lives in scripts/perf_floors.py.
        run: |
          cargo build --locked --release -p strata-cli
          python3 scripts/perf_floors.py --binary target/release/strata

  differential:
    # TCP4.2a/b: Strata KV vs in-process RocksDB (Tiers A/B + snapshot<->as_of
    # Tier C) and vs Redis (Tier A diversity oracle — architecturally unlike,
    # so it catches design-family blind spots an LSM-vs-LSM diff cannot);
    # Strata JSON vs MongoDB on the shared document tiers (TCP4.2b). Heavy
    # C++ oracle build, so nightly only; seeds/ops scale via env. The
    # committed corpora these lanes validate at record time replay in the
    # plain per-PR workspace suite (corpus_replay.rs) without any service.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: none
        ports:
          - 7474:7474
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Install libclang (rocksdb bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: KV differential soak vs RocksDB
        env:
          STRATA_KV_DIFF_SEEDS: "32"
          STRATA_KV_DIFF_OPS: "600"
          STRATA_REDIS_URL: 127.0.0.1:6379
        run: cargo test --locked -p strata-executor --features differential --test differential_kv -- --nocapture
      - name: JSON differential soak vs MongoDB
        env:
          STRATA_JSON_DIFF_SEEDS: "24"
          STRATA_JSON_DIFF_OPS: "500"
          STRATA_MONGO_URL: 127.0.0.1:27017
        run: cargo test --locked -p strata-executor --features differential --test differential_json -- --nocapture
      - name: Graph differential soak vs Neo4j (TCP4.2c)
        env:
          STRATA_GRAPH_DIFF_SEEDS: "16"
          STRATA_GRAPH_DIFF_OPS: "400"
          STRATA_NEO4J_URL: http://127.0.0.1:7474
        run: cargo test --locked -p strata-executor --features differential --test differential_graph -- --nocapture
      - name: Event differential soak vs Redis Streams (TCP4.2d)
        env:
          STRATA_EVENT_DIFF_SEEDS: "16"
          STRATA_EVENT_DIFF_OPS: "500"
          STRATA_REDIS_URL: 127.0.0.1:6379
        run: cargo test --locked -p strata-executor --features differential --test differential_event -- --nocapture
      # In-process exact k-NN oracle — no service container, no feature gate.
      - name: Vector differential soak vs exact k-NN oracle (TCP4.2e)
        env:
          STRATA_VECTOR_DIFF_SEEDS: "16"
          STRATA_VECTOR_DIFF_OPS: "500"
        run: cargo test --locked -p strata-executor --test differential_vector -- --nocapture

  catalog-reachability:
    # Every file the model catalog names must be on the hub. Two catalog
    # entries once pointed at repos that were never published (#3045) and
    # one variant at a file its repo does not hold (#3300); each surfaced as
    # a `models pull` failure long after the entry landed. One HEAD per
    # catalogued file, nothing downloaded, and the catalog's `size_bytes`
    # held to the window the downloader itself enforces. A red run here is
    # a catalog entry to remove or correct.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Authorize private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.STRATAHUB_READ_TOKEN }}@github.com/stratalab/stratahub".insteadOf "https://github.com/stratalab/stratahub"
      - uses: dtolnay/rust-toolchain@1.94.1
      - uses: Swatinem/rust-cache@v2
      - name: Every catalogued file is published on the hub
        run: cargo test --locked -p strata-inference --features download --lib every_catalogued_file_is_published_on_the_hub -- --ignored --nocapture
