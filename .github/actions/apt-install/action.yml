name: apt-install
description: >
  Install Ubuntu packages without letting the runner image's third-party
  repos fail the job (#3272): `apt-get update` refreshes ONLY the Ubuntu
  archives (`sources.list.d` disabled for the update, third-party indexes
  left untouched), with transport retries. Every package we install comes
  from Ubuntu main/universe, so a chrome-stable Hash Sum mismatch must
  never cost a lane — or a tag.
inputs:
  packages:
    description: Space-separated Ubuntu packages to install.
    required: true
runs:
  using: composite
  steps:
    - name: Update Ubuntu archives and install
      shell: bash
      run: |
        sudo apt-get update \
          -o Dir::Etc::sourceparts=- \
          -o APT::Get::List-Cleanup=0 \
          -o Acquire::Retries=3
        sudo apt-get install -y --no-install-recommends ${{ inputs.packages }}
