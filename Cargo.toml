[workspace]
resolver = "2"
default-members = [
    "crates/core",
    "crates/storage",
    "crates/engine",
    "crates/executor",
    "crates/inference",
    "crates/cli",
    "crates/stratadb",
    "crates/hub",
]
exclude = ["benchmarks"]
members = [
    "crates/core",
    "crates/storage",
    "crates/engine",
    "crates/executor",
    "crates/inference",
    "crates/cli",
    "crates/wasm",
    "crates/gpu-cache",
    "crates/stratadb",
    "crates/hub",
]

[workspace.package]
version = "1.2.1"
edition = "2021"
# The MSRV PROMISE, verified by the `msrv` CI job on every PR. Floor set by the
# stratahub crates, which ride in the default graph via strata-hub. Distinct
# from rust-toolchain.toml's pin, which is what contributors build with — see
# the note there (#3150).
rust-version = "1.91"
authors = ["Strata contributors"]
license = "Apache-2.0"
repository = "https://github.com/stratalab/strata-core"

[workspace.lints.rust]
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
# `--cfg loom` swaps the storage sync seam to loom primitives for the
# TCP4.3 schedule-exploration lane.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Relaxations for existing code patterns
module_name_repetitions = "allow"
too_many_arguments = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Existing code uses these patterns - fix in later cleanup
map_err_ignore = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
io_other_error = "allow"
option_map_or_none = "allow"
unnecessary_map_or = "allow"

[workspace.dependencies]
# Core dependencies shared across crates
# Terminal display width, for human table alignment (a CJK character is two
# columns wide, a combining mark none; counting scalars misaligns both).
unicode-width = "0.2"
uuid = { version = "1.6", features = ["v4", "v5", "serde"] }
serde = { version = "1.0", features = ["derive", "rc"] }
bincode = "1.3"
thiserror = "1.0"
# Concurrency
parking_lot = "0.12"
dashmap = "5"
rustc-hash = "1.1"
smallvec = "1.11"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Async runtime (for future network layer)
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde_bytes = "0.11"
rmp-serde = "1.1"
schemars = "1.2"
serde_yaml = "0.9"
byteorder = "1.5"
toml = "0.8"

# Archive/Compression (RunBundle)
tar = "0.4"
zstd = "0.13"
zstd-pure-rs = "0.1.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# HTTP client (model download)
ureq = "3"

# Encoding
base64 = "0.22"

# Testing
rand = "0.9.3"
tempfile = "3.8"
serde_json = "1.0"
proptest = "1.7"
criterion = "0.5"
serial_test = "3"
regex = "1.12"

# Cryptography
sha2 = "0.10"
aes-gcm = "0.10"
zeroize = "1"

# System
fs2 = "0.4"
libc = "0.2"
crc32fast = "1.3"
# wasm32-unknown-unknown needs an explicit JS entropy backend for the
# getrandom 0.2 chain (fast-hnsw -> rand 0.8); native targets ignore it.
getrandom = "0.2"
# std::time clocks trap on wasm32-unknown-unknown; web-time mirrors the same
# API over performance.now()/Date.now(). Only wired as a wasm32 target dep.
web-time = "1"

# Browser boundary (crates/wasm)
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
console_error_panic_hook = "0.1"

# Data structures
arc-swap = "1"
crossbeam-skiplist = "0.1"
static_assertions = "1.1"

# String similarity
strsim = "0.11"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Lazy initialization
once_cell = "1.18"

# Memory-mapped files
memmap2 = "0.9"

# Parallel iteration
rayon = "1.10"

# Arrow interoperability (optional, for import/export)
arrow = { version = "54", default-features = false, features = ["prettyprint", "csv", "json"] }
parquet = { version = "54", default-features = false, features = ["arrow", "snap", "zstd", "lz4"] }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false

[profile.bench]
inherits = "release"
