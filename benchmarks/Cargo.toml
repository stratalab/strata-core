[package]
name = "strata-benchmarks"
version = "0.1.0"
edition = "2021"
description = "Regression benchmarks for the Strata cleanup program"
license = "Apache-2.0"
publish = false
autobins = false
# `benches/ycsb_workloads.rs` is a `#[path]`-shared module, not a bench
# target; without this it is silently auto-discovered as an empty libtest
# bench. Every real bench target is declared explicitly below.
autobenches = false

[features]
default = []
rocksdb-compare = ["dep:rocksdb"]

[dependencies]
strata-engine = { path = "../crates/engine", features = ["testkit"] }
strata-storage = { path = "../crates/storage", features = ["perf-trace"] }
serde = { version = "1.0", features = ["derive"] }
# The old root `stratadb` package (a bench dependency until the V1 cutover)
# installed jemalloc as the global allocator, so every recorded benchmark
# number is a jemalloc number. Pin it here explicitly to keep the instrument
# comparable across the cutover — glibc malloc costs ~25% on the write path.
tikv-jemallocator = { version = "0.6", features = ["profiling"] }
# Live allocator gauges for the RSS-attribution probe (roadmap-v2 T4): the
# allocated/active/resident/retained split separates app-held memory from
# allocator retention per benchmark phase.
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }

serde_json = "1.0"
tempfile = "3.8"
fastrand = "2.0.0"
chrono = "0.4"
rocksdb = { version = "0.22.0", default-features = false, features = [
    "lz4",
], optional = true }

# TCP5.2: the wire-level instruction-count benches drive the executor's
# public `Command`/`Executor` surface. Default features are trimmed — `hub`
# (HTTP/tokio) and `arrow` (parquet) are dead weight for benches.
strata-executor = { path = "../crates/executor", default-features = false, features = [
    "localfs",
] }

[dev-dependencies]
byte-unit = "5.1.6"
walkdir = "2.5.0"
hex = "0.4"
# TCP5.2 instruction-count gates: deterministic callgrind counts, requires
# valgrind plus a matching-version `iai-callgrind-runner` on PATH.
iai-callgrind = "0.16.1"
base64 = "0.22"

[[bench]]
name = "storage_commit"
path = "benches/storage_commit.rs"
harness = false

[[bench]]
name = "storage_reopen"
path = "benches/storage_reopen.rs"
harness = false

[[bench]]
name = "wire_commands"
path = "benches/wire_commands.rs"
harness = false

[[bin]]
name = "storage-amplification"
path = "src/bin/storage_amplification.rs"

[[bin]]
name = "bench-compare"
path = "src/bin/compare.rs"

[[bin]]
name = "storage-l9-scale"
path = "src/bin/storage_next_l9_scale.rs"

[[bin]]
name = "storage-point-spike"
path = "src/bin/storage_next_point_spike.rs"

[[bin]]
name = "storage-concurrent-writers"
path = "src/bin/storage_next_concurrent_writers.rs"

[[bin]]
name = "storage-concurrent-reads"
path = "src/bin/storage_next_concurrent_reads.rs"

[[bin]]
name = "engine-kv-scan-regression"
path = "src/bin/engine_kv_scan_regression.rs"

[[bin]]
name = "engine-kv-scale"
path = "src/bin/engine_kv_scale.rs"

[[bin]]
name = "engine-ycsb"
path = "src/bin/engine_ycsb.rs"

[[bin]]
name = "amp-repro"
path = "src/bin/amp_repro.rs"

[[bin]]
name = "rocksdb-ycsb"
path = "src/bin/rocksdb_ycsb.rs"
required-features = ["rocksdb-compare"]

[[bin]]
name = "engine-vector-indexing"
path = "src/bin/engine_vector_indexing.rs"

[[bin]]
name = "storage-after-version-scan"
path = "src/bin/storage_next_after_version_scan.rs"

[[bin]]
name = "storage-l0-compact"
path = "src/bin/storage_next_l0_compact.rs"

[profile.bench]
debug = true

# Explicit standalone-workspace root. A no-op in the main checkout (the root manifest already
# excludes `benchmarks/`), but required for git worktrees: without it, cargo walks up past the
# worktree and resolves against the ORIGINAL checkout's root manifest, whose `exclude`
# entries don't match the worktree path — "current package believes it's in a workspace".
[workspace]
