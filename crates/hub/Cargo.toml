[package]
name = "strata-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "StrataHub adapter: bundle export/import and hub orchestration over the Strata engine"
publish = false

[dependencies]
# Wire-contract dependencies (coordination doc §3.1): serde_jcs is pinned
# byte-for-byte to stratahub's workspace pin; blake3 is byte-deterministic
# by spec at any 1.x.
blake3 = "1"
serde_jcs = "=0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strata-core = { path = "../core" }
strata-engine = { path = "../engine" }
tempfile = "3"
async-trait = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
dirs = "6"
futures-util = { version = "0.3", optional = true }
semver = "1"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = "0.8"
url = "2"
stratahub-client = { git = "https://github.com/stratalab/stratahub", rev = "ad0eca4395afbfb45117d24b61cd44f6cb730e58" }
stratahub-ingest = { git = "https://github.com/stratalab/stratahub", rev = "ad0eca4395afbfb45117d24b61cd44f6cb730e58", optional = true }
stratahub-protocol = { git = "https://github.com/stratalab/stratahub", rev = "ad0eca4395afbfb45117d24b61cd44f6cb730e58" }

[features]
# The stratahub-ingest Engine trait impl (HB5). Off by default: their
# ingest stack transitively git-pins strata-executor (the engine swap),
# which must not enter this workspace's default graph — the executor
# consumes this crate for clone orchestration, and the pin would create
# a duplicate/cyclic strata-executor. stratahub's ingest CLI enables it.
ingest = ["dep:stratahub-ingest", "dep:async-trait", "dep:bytes", "dep:futures-util"]

[[test]]
name = "ingest_engine"
required-features = ["ingest"]

[dev-dependencies]
futures-util = "0.3"

tiny_http = "0.12"
stratahub-testkit = { git = "https://github.com/stratalab/stratahub", rev = "ad0eca4395afbfb45117d24b61cd44f6cb730e58" }

[lints]
workspace = true
