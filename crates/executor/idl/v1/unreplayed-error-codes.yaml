# Replay-coverage allowlist (drift guard, TCP3.8b).
#
# Distinct from uncovered-error-codes.yaml: that list tracks whether a code is
# DOCUMENTED (declared in errors.yaml). This list tracks whether a declared code
# has an error-case REPLAY FIXTURE that runs it against a scratch executor and
# pins the resulting ErrorStatus envelope (code/class/retry_policy/retryable/
# commit_outcome). A mis-mapped class or a changed retry policy fails the replay
# instead of shipping silently to every SDK.
#
# Every code any command declares in errors[] must be replayed by at least one
# error case (a fixtures.error_cases entry) or listed here. This list may ONLY
# shrink: authoring a replay for a code requires deleting its line, and the
# guard fails if a listed code becomes replayed or is no longer declared by any
# command.
#
# The remaining entries need harnesses this replay lane does not provide: a
# closed runtime (runtime_closed), a live inference provider or an environment
# the fake runtime's fixed world does not have (inference.*, see S2b), Arrow
# feature builds and IO faults (*.executor.arrow*), a configured hub
# (*.hub_*), or state/fault setup not yet authored. Corruption- and
# data-loss-class codes are covered separately by TCP3.15.
#
# `budget` (W0b) MUST equal the number of `unreplayed` entries below. The list is
# shrink-only per entry; this budget caps the TOTAL so the debt cannot creep up
# silently (it grew 105->110 before this gate existed). Adding an entry requires
# raising `budget` in the same change with a rationale (owner + issue/slice +
# planned harness); draining entries requires lowering `budget` to match. Enforced
# by `enforce_debt_budget` in `crates/executor/src/idl_tooling.rs`.
#
# 110 -> 111 (#3078): invalid_argument.executor.arrow_non_finite_float joins the
# *.executor.arrow* debt group — arrow.import's fixture is replay_skip'd (it reads
# a real file the scratch executor lacks), so pinning this envelope needs the same
# file-reading arrow replay harness the sibling arrow codes are waiting on.
# 111 -> 112 (#3079): invalid_argument.executor.arrow_encoding joins the same
# *.executor.arrow* group for the same replay-skip reason (unsupported key/value
# cell encoding on import).
# 112 -> 114 (#3236): inference.provider_model_not_found and
# inference.provider_quota_exhausted join the inference.* debt group — both are
# classified from a live provider's error body, which this replay lane cannot
# produce; they wait on the same live-provider harness as their siblings.
# 114 -> 115 (S2a, #3256): inference.unknown_model joins the inference.* debt
# group with its sibling missing_model — the replay lane's fake runtime does not
# resolve model specs, so no fixture can raise it until the fake composes the
# real resolver (S2b, tracker #3261), which drains the resolution-time codes.
# 115 -> 112 (S2b, #3226/#3252): inference.unknown_model, inference.invalid_request
# and inference.unsupported_operation leave the group — the replay lane's fake
# runtime now composes the real resolver over the real catalog, so a name the
# catalog does not know, a malformed spec, and a model held to its catalogued
# task are replayed from `inference.*` and `vector --text` error cases. The
# fake's world is one where every catalogued model is present, every provider
# is built, the network is on and every key is set — it rewrites those
# environment answers after the resolver has spoken, and only a test that opts
# a model out with `FakeInferenceService::with_undownloaded` sees NotDownloaded.
# The replay lane's fake opts nothing out, so missing_model, missing_api_key,
# download_disabled and unsupported_provider stay: they are environment facts
# the fake world fixes, covered by the inference resolution matrix and the
# real-runtime executor tests instead.
