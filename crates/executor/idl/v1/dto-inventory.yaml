# DTO inventory (#3322; S0c of the CLI output contract).
#
# The complete set of response models the command surface publishes. Nothing
# authors these names: `strata-idl generate` derives each command's
# `response_model` from its family template (`kinds.yaml`, or the command's
# own `response_model:` override) and the `$def` its generated schema carries
# at the family's payload slot, then checks the result against this list in
# BOTH directions -- a derived model this list lacks fails `generate`/`check`
# (every published model is reviewed once, when it is added here), and a
# listed model no command derives fails too (the list carries only the models
# in use, so a rename or a retired command cannot leave a ghost entry).
#
# Spelling is the schema's: the payload is the `$defs` key the schema
# references (`Maybe<VersionedValue>`) or, for a primitive payload, the JSON
# Schema type (`StatusValue<integer>`, `Page<string>`, `integer[]`).
# `MutationAck` carries no payload. The ledgered commands
# (`response-model-divergences.yaml`) contribute their `declared` target.
#
# Sorted; keep it that way.
response_models:
