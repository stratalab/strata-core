# Named error sets (#3250).
#
# A set names a group of error codes that recurs across commands, families,
# or kinds — the reason it exists is that no single overlay layer can hold a
# group that crosses those boundaries (the embeddings runtime set is raised by
# `inference.*` and `vector.*` commands of three different kinds).
#
# Reference a set from any error list as `set:<id>`: a layer's `errors:`, a
# command's `errors+:` / `errors-:`, or a set declared below it. The resolver
# expands every reference in place before layering, so generated artifacts
# only ever see codes.
#
# Rules the resolver enforces:
#   - ids are dotted lowercase segments (`family.name`); no duplicates
#   - every member is declared in errors.yaml
#   - a set may only reference sets declared ABOVE it (acyclic by construction)
#   - a set expands to at least two distinct codes
#   - every set is referenced at least once
#   - a list that spells out every code of a set is rejected: reference the
#     set instead. That is the hand-copy this file exists to end.
#
# Runtime truth for the inference sets is `crates/inference/src/error.rs`;
# `crates/executor/tests/inference_behavior.rs` keeps the sets aligned with it.
sets:
  # What a local-model operation can raise: the model is unknown or not
  # downloaded, the models directory cannot be read, the model cannot be
  # loaded, fails at runtime, or the registry that names it is corrupt.
  - id: inference.local_model
    errors:
      - inference.invalid_request
      - inference.unsupported_operation
      - inference.missing_model
      - inference.unknown_model
      - inference.io_failure
      - inference.model_load_failed
      - inference.local_runtime_failed
      - inference.registry_corrupt
  # What a hosted-provider call can raise (#3239).
  - id: inference.provider_failure
    errors:
      - inference.missing_api_key
      - inference.provider_auth_failed
      - inference.provider_unavailable
      - inference.provider_timeout
      - inference.provider_rate_limited
      - inference.provider_quota_exhausted
      - inference.provider_model_not_found
      - inference.invalid_request
      - inference.provider_malformed_response
  # Everything a model-backed operation can raise: generate, embed, and the
  # vector commands that embed text on the caller's behalf.
  - id: inference.model_runtime
    errors:
      - set:inference.local_model
      - set:inference.provider_failure
      - inference.unsupported_provider
      - inference.unsupported_parameter
  # What validating a KV batch's shape can raise: a malformed batch, or a key
  # repeated within it (caught at the engine or the executor). Shared by
  # `kv.batch_put` and `kv.batch_delete` (#3273).
  - id: kv.batch_input
    errors:
      - invalid_argument.engine.kv_batch
      - invalid_argument.engine.kv_batch_duplicate_key
      - invalid_argument.executor.kv_batch_duplicate_key
  # What writing a JSON document can raise: a bad path, an unwritable value, or
  # a document that breaks a structural limit. Shared by `json.set` and each
  # entry of `json.batch_set` (which adds its own duplicate-id code) (#3273).
  - id: json.document_write
    errors:
      - invalid_argument.engine.json_path
      - invalid_argument.engine.json_path_too_long
      - invalid_argument.engine.json_path_not_found
      - invalid_argument.engine.json_path_type
      - invalid_argument.engine.json_value
      - invalid_argument.engine.json_document_too_large
      - invalid_argument.engine.json_document_too_deep
      - invalid_argument.engine.json_array_too_large
  # What defining a graph ontology type can raise: a bad or reserved type name,
  # a bad property name, or a write against a frozen ontology. Shared by
  # `graph.ontology.define_object_type` and `define_link_type` (#3273).
  - id: graph.ontology_definition
    errors:
      - invalid_argument.engine.graph_type_name
      - invalid_argument.engine.graph_type_name_reserved
      - invalid_argument.engine.graph_property_name
      - failed_precondition.engine.graph_ontology_frozen
  # What writing a graph edge can raise: a bad node id, edge type, weight,
  # endpoint, or properties, a negative weight, or an ontology edge-type
  # violation. Shared by `graph.edge.add` and `graph.bulk_insert`, each of
  # which adds its own ontology codes (#3273).
  - id: graph.edge_write
    errors:
      - invalid_argument.engine.graph_node_id
      - invalid_argument.engine.graph_edge_type
      - invalid_argument.engine.graph_edge_weight
      - invalid_argument.engine.graph_edge_endpoint
      - invalid_argument.engine.graph_properties
      - invalid_argument.engine.graph_properties_too_large
      - failed_precondition.engine.graph_negative_weight
      - failed_precondition.engine.graph_ontology_edge_type
  # What every Arrow import/export shares: an invalid space, the feature built
  # out, a bad format or collection or graph target, an IO fault, or an
  # internal Arrow error. Each command adds its own direction-specific codes
  # (#3273).
  - id: arrow.io
    errors:
      - invalid_argument.engine.product_space
      - unsupported.executor.arrow_feature_disabled
      - invalid_argument.executor.arrow_format
      - invalid_argument.executor.arrow_collection
      - invalid_argument.executor.arrow_graph
      - unavailable.executor.arrow_io
      - internal.executor.arrow
