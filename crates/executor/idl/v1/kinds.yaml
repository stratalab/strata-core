kinds:
  - id: mutation.create
    access: write
    commit: commits_on_success
    render: mutation_ack
    response_model: MutationAck
    snippets:
      - mutation-ack.md
  - id: mutation.put
    access: write
    commit: commits_on_success
    render: mutation_ack
    response_model: MutationAck
    snippets:
      - mutation-ack.md
  - id: mutation.delete
    access: write
    commit: commits_on_success
    render: mutation_ack
    response_model: MutationAck
    snippets:
      - mutation-ack.md
  - id: mutation.bulk_delete
    access: write
    commit: commits_on_success
    render: mutation_ack
    response_model: MutationAck
    snippets:
      - mutation-ack.md
  - id: mutation.metadata_update
    access: write
    commit: commits_on_success
    render: mutation_ack
    response_model: MutationAck
    snippets:
      - mutation-ack.md
  - id: mutation.merge
    access: write
    commit: commits_on_success
    render: mutation_ack
    response_model: MutationAck
    snippets:
      - mutation-ack.md
  - id: read.get
    access: read
    commit: none
    render: optional
    response_model: Maybe<{payload}>
    snippets:
      - optional-read.md
  - id: read.history
    access: read
    commit: none
    render: history
    response_model: Maybe<Vec<{payload}>>
    snippets:
      - optional-read.md
  - id: read.page
    access: read
    commit: none
    render: page
    pagination: cursor
    response_model: Page<{payload}>
    snippets:
      - cursor-page.md
  - id: read.search
    access: read
    commit: none
    render: search
    pagination: bounded
    response_model: SearchResult<{payload}>
    snippets:
      - search-result.md
  - id: read.diagnostics
    access: read
    commit: none
    render: search
    pagination: bounded
    response_model: SearchResult<{payload}> + IndexDiagnostics
    snippets:
      - search-result.md
      - diagnostics.md
  - id: read.status
    access: read
    commit: none
    render: status_value
    response_model: StatusValue<{payload}>
    snippets:
      - status-value.md
  - id: read.sample
    access: read
    commit: none
    render: page
    pagination: sample
    response_model: SamplePage<{payload}>
    snippets:
      - cursor-page.md
  - id: batch.itemwise_mutation
    cli_surface: wire
    access: write
    commit: itemwise_shared_commit
    render: batch
    batch: itemwise
    response_model: BatchResult<{payload}>
    snippets:
      - itemwise-batch.md
  - id: batch.itemwise_read
    cli_surface: wire
    access: read
    commit: none
    render: batch
    batch: itemwise
    response_model: BatchResult<{payload}>
    snippets:
      - itemwise-batch.md
  - id: batch.itemwise_status
    cli_surface: wire
    access: read
    commit: none
    render: batch
    batch: itemwise
    response_model: BatchResult<{payload}>
    snippets:
      - itemwise-batch.md
  - id: read.analytics
    access: read
    commit: none
    render: analytics
    response_model: AnalyticsResult<{payload}>
    snippets:
      - analytics-result.md
  - id: batch.atomic_mutation
    cli_surface: wire
    access: write
    commit: commits_on_success
    render: batch
    batch: atomic
    response_model: BatchResult<{payload}>
    snippets:
      - atomic-batch.md
  - id: read.summary
    access: read
    commit: none
    render: status_sections
    response_model: StatusResponse<{payload}>
    snippets:
      - status-value.md
  - id: action.status
    access: write
    commit: none
    render: status_sections
    response_model: StatusResponse<{payload}>
    snippets:
      - status-value.md
  - id: inference.models_page
    access: read
    commit: none
    render: page
    pagination: cursor
    response_model: Page<{payload}>
  - id: inference.runtime_op
    access: read
    commit: none
    render: status_sections
    response_model: "{payload}"
