# Error-code exhaustiveness allowlist (drift guard, mirrors uncovered-commands.yaml).
#
# Every registered public error code (executor + inference + engine) must be
# declared in `errors.yaml` — so SDK-facing docs surface it — or listed here.
# This list may ONLY shrink: declaring a code in errors.yaml requires deleting
# its line, and the resolver fails if a listed code is undocumented-but-covered,
# is not registered, or if a newly registered code is neither declared nor
# listed. Do not add entries for new codes — declare them in errors.yaml.
#
# The current entries are cross-cutting engine-internal codes (persistence,
# data-loss, corruption, control-plane) plus two executor codes that are not
# tied to a single public command (`internal.executor.unregistered_code`, the
# unregistered-code fallback, and `invalid_argument.executor.batch_item`, the
# documented batch-item error shape). They are grandfathered pending per-surface
# error mapping.
