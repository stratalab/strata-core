commands:
  - id: arrow.import
    kind: action.status
    title: Import Arrow file
    input: Command::ArrowImport
    output: Output::ArrowImportResult
    access: write
    commit: commits_on_success
    prose: commands/arrow.import.md
    errors+:
      - invalid_argument.engine.product_space
      - unsupported.executor.arrow_feature_disabled
      - invalid_argument.executor.arrow_format
      - invalid_argument.executor.arrow_input_missing
      - invalid_argument.executor.arrow_key_column
      - invalid_argument.executor.arrow_value_column
      - invalid_argument.executor.arrow_collection
      - invalid_argument.executor.arrow_embedding_type
      - invalid_argument.executor.arrow_encoding
      - invalid_argument.executor.arrow_json_key
      - invalid_argument.executor.arrow_non_finite_float
      - invalid_argument.executor.arrow_base64
      - invalid_argument.executor.arrow_vector_key
      - invalid_argument.executor.arrow_event
      - invalid_argument.executor.arrow_graph
      - not_found.engine.vector_collection
      - unavailable.executor.arrow_io
      - internal.executor.arrow
    display:
      receipt: "imported {/data/rows_imported|plural:row} into {/data/target} from {/data/file_path} ({/data/rows_skipped} skipped)"
    fixtures:
      request: requests/v1/arrow/import.json
      response: responses/v1/arrow/import_kv_csv.json
      replay_skip: arrow import reads a real file from the filesystem; the source file does not exist on the scratch cache executor
  - id: arrow.export
    kind: action.status
    title: Export Arrow file
    input: Command::ArrowExport
    output: Output::ArrowExportResult
    access: read
    prose: commands/arrow.export.md
    errors+:
      - invalid_argument.engine.product_space
      - unsupported.executor.arrow_feature_disabled
      - invalid_argument.executor.arrow_format
      - invalid_argument.executor.arrow_empty_export
      - invalid_argument.executor.arrow_vector_dimension
      - invalid_argument.executor.arrow_graph
      - invalid_argument.executor.arrow_collection
      - unavailable.executor.arrow_io
      - internal.executor.arrow
    display:
      receipt: "exported {/data/row_count|plural:row} of {/data/primitive} to {/data/paths/0} ({/data/size_bytes|size})"
    fixtures:
      request: requests/v1/arrow/export.json
      response: responses/v1/arrow/export_kv_csv.json
      replay_skip: arrow export writes real files to a filesystem path outside the scratch cache executor
