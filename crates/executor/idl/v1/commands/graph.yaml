commands:
  - id: graph.create
    kind: mutation.create
    title: Create graph
    input: Command::GraphCreate
    output: Output::GraphCreateResult
    result: GraphInfoData
    response_model: MutationAck<GraphInfoData>
    prose: commands/graph.create.md
    errors+:
      - already_exists.engine.graph
      - invalid_argument.engine.graph_name_reserved
    errors-:
      - not_found.engine.graph
    display:
      receipt: "{verb} graph {/data/info/graph}"
      identity:
        - /data/info/graph
    fixtures:
      request: requests/v1/graph/create.json
      response: responses/v1/graph/create_applied.json
      error_cases:
        - request: requests/v1/graph/create_empty_name.json
          expected_error: responses/v1/errors/graph/create_empty_name.json
        - setup:
            - requests/v1/graph/create.json
          request: requests/v1/graph/create.json
          expected_error: responses/v1/errors/graph/create_duplicate.json
  - id: graph.delete
    kind: mutation.delete
    title: Delete graph
    input: Command::GraphDelete
    output: Output::GraphDeleteResult
    result: GraphDelete
    prose: commands/graph.delete.md
    display:
      receipt: "{verb} graph {/data/graph}"
      noun: graph
      identity:
        - /data/graph
    fixtures:
      setup:
        - requests/v1/graph/create.json
      request: requests/v1/graph/delete.json
      response: responses/v1/graph/delete_applied.json
  - id: graph.list
    kind: read.page
    title: List graphs
    input: Command::GraphList
    output: Output::GraphNamePage
    result: String
    response_model: Page<String, String>
    prose: commands/graph.list.md
    errors-:
      - not_found.engine.graph
    display:
      columns:
        - field: /data/items/*
    fixtures:
      setup:
        - requests/v1/graph/create.json
      request: requests/v1/graph/list.json
      response: responses/v1/graph/list_page.json
  - id: graph.meta
    kind: read.get
    title: Read graph metadata
    input: Command::GraphGetMeta
    output: Output::GraphInfoResult
    result: GraphInfoData
    prose: commands/graph.meta.md
    display:
      fields:
        - field: /data/graph
        - field: /data/node_count
        - field: /data/edge_count
        - field: /data/created_version
        - field: /data/updated_version
    fixtures:
      setup:
        - requests/v1/graph/create.json
        - requests/v1/graph/node_add.json
        - requests/v1/setup/graph_add_bob.json
        - requests/v1/graph/edge_add.json
      request: requests/v1/graph/meta.json
      response: responses/v1/graph/meta_found.json
  - id: graph.node.add
    kind: mutation.put
    title: Add graph node
    cli_path: ["graph", "add-node"]
    input: Command::GraphAddNode
    output: Output::GraphNodeWriteResult
    result: GraphNodeWrite
    prose: commands/graph.node.add.md
    errors+:
      - invalid_argument.engine.graph_node_id
      - invalid_argument.engine.graph_properties
      - invalid_argument.engine.graph_properties_too_large
      - invalid_argument.engine.graph_type_hint
      - invalid_argument.engine.graph_binding
      - unsupported.engine.graph_binding_cross_branch
      - failed_precondition.engine.graph_ontology_node_type
      - failed_precondition.engine.graph_ontology_required_property
    display:
      receipt: "{verb} node {/data/node_id} in {/data/graph}"
      noun: node
      identity:
        - /data/node_id
    fixtures:
      setup:
        - requests/v1/graph/create.json
      request: requests/v1/graph/node_add.json
      response: responses/v1/graph/node_add_applied.json
  - id: graph.node.get
