commands:
  - id: hub.info
    kind: read.summary
    title: Read hub info
    input: Command::HubInfo
    output: Output::HubInfo
    cli_path: ["hub", "info"]
    prose: commands/hub.info.md
    display:
      fields:
        - field: /data/server_implementation
        - field: /data/server_version
        - field: /data/protocol_version
        - field: /data/hash_algorithm
        - field: /data/max_dataset_size_bytes
          header: max_dataset_size
          as: size
        - field: /data/max_object_size_bytes
          header: max_object_size
          as: size
        - field: /data/max_manifest_size_bytes
          header: max_manifest_size
          as: size
        - field: /data/supported_object_content_types
          as: list
        - field: /data/telemetry_endpoint_enabled
    fixtures:
      request: requests/v1/hub/info.json
      response: responses/v1/hub/info.json
      replay_skip: hub browse reads a configured StrataHub over the network; it never runs against the scratch cache executor
  - id: hub.list_datasets
    kind: read.summary
    title: List hub datasets
    input: Command::HubListDatasets
    output: Output::HubDatasets
    cli_path: ["hub", "list-datasets"]
    prose: commands/hub.list_datasets.md
    errors+:
      - invalid_argument.executor.hub_filter
    display:
      columns:
        - field: /data/items/*/name
        - field: /data/items/*/badge
        - field: /data/items/*/license
        - field: /data/items/*/primitives
          as: list
        - field: /data/items/*/size_bytes
          header: SIZE
          as: size
        - field: /data/items/*/downloads
        - field: /data/items/*/last_updated
    fixtures:
      request: requests/v1/hub/list_datasets.json
      response: responses/v1/hub/datasets.json
      replay_skip: hub browse reads a configured StrataHub over the network; it never runs against the scratch cache executor
      error_cases:
        - request: requests/v1/hub/list_datasets_bad_limit.json
          expected_error: responses/v1/errors/hub/list_datasets_bad_limit.json
  - id: hub.get_dataset
    kind: read.summary
    title: Read hub dataset
    input: Command::HubGetDataset
    output: Output::HubDataset
    cli_path: ["hub", "get-dataset"]
    prose: commands/hub.get_dataset.md
    errors+:
      - invalid_argument.executor.hub_dataset
      - not_found.executor.hub_dataset
    display:
      fields:
        - field: /data/name
        - field: /data/owner
        - field: /data/badge
        - field: /data/description
        - field: /data/license
        - field: /data/primitives
          as: list
        - field: /data/tags
          as: list
        - field: /data/tasks
          as: list
        - field: /data/size_bytes
          header: size
          as: size
        - field: /data/downloads
        - field: /data/default_branch
        - field: /data/created
        - field: /data/last_updated
        - field: /data/engine_version_required
        - field: /data/clone_command
    fixtures:
      request: requests/v1/hub/get_dataset.json
      response: responses/v1/hub/dataset.json
      replay_skip: hub browse reads a configured StrataHub over the network; it never runs against the scratch cache executor
  - id: hub.list_refs
    kind: read.summary
    title: List hub dataset refs
    input: Command::HubListRefs
    output: Output::HubRefs
    cli_path: ["hub", "list-refs"]
    prose: commands/hub.list_refs.md
    errors+:
      - invalid_argument.executor.hub_dataset
      - not_found.executor.hub_dataset
    display:
      fields:
        - field: /data/dataset
        - field: /data/default_branch
        - field: /data/refs
          as: table
    fixtures:
      request: requests/v1/hub/list_refs.json
      response: responses/v1/hub/refs.json
      replay_skip: hub browse reads a configured StrataHub over the network; it never runs against the scratch cache executor
  - id: hub.list_yanked
    kind: read.summary
    title: List yanked hub refs
    input: Command::HubListYanked
    output: Output::HubYanked
    cli_path: ["hub", "list-yanked"]
    prose: commands/hub.list_yanked.md
    errors+:
      - invalid_argument.executor.hub_since
      - not_found.executor.hub_resource
    display:
      columns:
        - field: /data/items/*/dataset
        - field: /data/items/*/branch
        - field: /data/items/*/reason
        - field: /data/items/*/yanked_at
        - field: /data/items/*/manifest_hash
    fixtures:
      request: requests/v1/hub/list_yanked.json
      response: responses/v1/hub/yanked.json
      replay_skip: hub browse reads a configured StrataHub over the network; it never runs against the scratch cache executor
      error_cases:
        - request: requests/v1/hub/list_yanked_bad_since.json
          expected_error: responses/v1/errors/hub/list_yanked_bad_since.json
