commands:
  - id: inference.models.list
    kind: inference.models_page
    title: List catalog models
    input: Command::InferenceModelsList
    output: Output::InferenceModels
    result: ModelInfo
    prose: commands/inference.models.list.md
    display: bespoke
    fixtures:
      request: requests/v1/inference/models_list.json
      response: responses/v1/inference/models_list.json
  - id: inference.models.local
    kind: inference.models_page
    title: List local models
    input: Command::InferenceModelsLocal
    output: Output::InferenceModels
    result: ModelInfo
    prose: commands/inference.models.local.md
    display: bespoke
    fixtures:
      request: requests/v1/inference/models_local.json
      response: responses/v1/inference/models_local.json
  - id: inference.models.pull
    kind: inference.runtime_op
    title: Download a model
    input: Command::InferenceModelsPull
    output: Output::InferenceModelPulled
    result: PullModelOutput
    response_model: PullModelOutput
    prose: commands/inference.models.pull.md
    errors+:
      - inference.invalid_request
      - inference.unsupported_operation
      - inference.download_disabled
      - inference.missing_model
      - inference.unknown_model
      - inference.download_failed
      - inference.download_verification_failed
      - inference.io_failure
      - inference.registry_corrupt
    display: bespoke
    fixtures:
      request: requests/v1/inference/models_pull.json
      response: responses/v1/inference/models_pull.json
      error_cases:
        - request: requests/v1/inference/models_pull_unknown_model.json
          expected_error: responses/v1/errors/inference/unknown_model.json
        - request: requests/v1/inference/models_pull_cloud_model.json
          expected_error: responses/v1/errors/inference/unsupported_operation.json
  - id: inference.capability
    kind: inference.runtime_op
    title: Report model capabilities
    input: Command::InferenceModelCapability
    output: Output::InferenceCapability
    result: InferenceCapability
    response_model: InferenceCapability
    prose: commands/inference.capability.md
    errors+:
      - inference.invalid_request
      - inference.io_failure
    display:
      fields:
        - field: /data/provider
        - field: /data/model
        - field: /data/availability
        - field: /data/can_generate
        - field: /data/can_embed
        - field: /data/can_rank
        - field: /data/can_tokenize
        - field: /data/embedding_dim
        - field: /data/requires_api_key
        - field: /data/requires_network
        - field: /data/network_enabled
        - field: /data/provider_feature_enabled
        - field: /data/supports_tools
        - field: /data/supports_json_object
        - field: /data/supports_json_schema
        - field: /data/supports_logprobs
    fixtures:
      request: requests/v1/inference/capability.json
      response: responses/v1/inference/capability.json
      error_cases:
        - request: requests/v1/inference/capability_malformed_spec.json
          expected_error: responses/v1/errors/inference/invalid_request.json
  - id: inference.generate
    kind: inference.runtime_op
    title: Generate text
    input: Command::InferenceGenerate
    output: Output::InferenceGeneration
    result: ChatResponse
    response_model: ChatResponse
    prose: commands/inference.generate.md
    errors+:
      - set:inference.model_runtime
    display: bespoke
    fixtures:
      request: requests/v1/inference/generate.json
      response: responses/v1/inference/generate.json
      error_cases:
        - request: requests/v1/inference/generate_unknown_model.json
          expected_error: responses/v1/errors/inference/unknown_model.json
        - request: requests/v1/inference/generate_wrong_task.json
          expected_error: responses/v1/errors/inference/unsupported_operation.json
  - id: inference.tokenize
    kind: inference.runtime_op
    title: Tokenize text
    input: Command::InferenceTokenize
    output: Output::InferenceTokenIds
    result: TokenIds
    response_model: TokenIds
    prose: commands/inference.tokenize.md
    errors+:
      - set:inference.local_model
    display: bespoke
    fixtures:
      request: requests/v1/inference/tokenize.json
      response: responses/v1/inference/tokenize.json
      error_cases:
        - request: requests/v1/inference/tokenize_unknown_model.json
          expected_error: responses/v1/errors/inference/unknown_model.json
  - id: inference.detokenize
    kind: inference.runtime_op
    title: Detokenize token ids
    input: Command::InferenceDetokenize
    output: Output::InferenceText
    result: DetokenizedText
    response_model: DetokenizedText
    prose: commands/inference.detokenize.md
    errors+:
      - set:inference.local_model
    display: bespoke
    fixtures:
      request: requests/v1/inference/detokenize.json
      response: responses/v1/inference/text.json
  - id: inference.embed
    kind: inference.runtime_op
    title: Embed one or more texts
    input: Command::InferenceEmbed
    output: Output::InferenceEmbeddings
    result: EmbeddingsResponse
    response_model: EmbeddingsResponse
    prose: commands/inference.embed.md
    errors+:
      - set:inference.model_runtime
    display: bespoke
    fixtures:
      request: requests/v1/inference/embed.json
      response: responses/v1/inference/embed.json
      error_cases:
        - request: requests/v1/inference/embed_unknown_model.json
          expected_error: responses/v1/errors/inference/unknown_model.json
        - request: requests/v1/inference/embed_malformed_spec.json
          expected_error: responses/v1/errors/inference/invalid_request.json
        - request: requests/v1/inference/embed_wrong_task.json
          expected_error: responses/v1/errors/inference/unsupported_operation.json
  - id: inference.rank
    kind: inference.runtime_op
    title: Rank passages
    input: Command::InferenceRank
    output: Output::InferenceRanking
    result: RankResponse
    response_model: RankResponse
    prose: commands/inference.rank.md
    errors+:
      - set:inference.local_model
    display: bespoke
    fixtures:
      request: requests/v1/inference/rank.json
      response: responses/v1/inference/rank.json
      error_cases:
        - request: requests/v1/inference/rank_wrong_task.json
          expected_error: responses/v1/errors/inference/unsupported_operation.json
  - id: inference.unload
    kind: inference.runtime_op
    title: Unload cached models
    input: Command::InferenceUnload
    output: Output::InferenceUnloadResult
    result: InferenceUnloadResult
    response_model: InferenceUnloadResult
    prose: commands/inference.unload.md
    display: bespoke
    fixtures:
      request: requests/v1/inference/unload.json
      response: responses/v1/inference/unload.json
  - id: inference.status
    kind: inference.runtime_op
    title: Report inference readiness
    input: Command::InferenceStatus
    output: Output::InferenceStatus
    result: InferenceStatus
    response_model: InferenceStatus
    prose: commands/inference.status.md
    display: bespoke
    fixtures:
      request: requests/v1/inference/status.json
      response: responses/v1/inference/status.json
  - id: inference.cache_status
    kind: inference.runtime_op
    title: Report model cache
    input: Command::InferenceCacheStatus
    output: Output::InferenceCacheStatus
    result: ModelCacheStatus
    response_model: ModelCacheStatus
    prose: commands/inference.cache_status.md
    display:
      fields:
        - field: /data/generation_models
          as: list
        - field: /data/embedding_models
          as: list
        - field: /data/ranking_models
          as: list
    fixtures:
      request: requests/v1/inference/cache_status.json
      response: responses/v1/inference/cache_status.json
