  - id: vector.metadata.update
    kind: mutation.metadata_update
    title: Update vector metadata
    cli_path: ["vector", "update-metadata"]
    input: Command::VectorUpdateMetadata
    output: Output::VectorMetadataUpdateResult
    result: VectorMetadataUpdate
    prose: commands/vector.metadata.update.md
    errors+:
      - invalid_argument.engine.vector_metadata_patch
    fixtures:
      setup:
        - requests/v1/vector/collection_create.json
