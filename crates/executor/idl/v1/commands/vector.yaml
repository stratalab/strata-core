        - requests/v1/setup/vector_upsert_doc_b.json
      request: requests/v1/vector/metadata_update.json
      response: responses/v1/vector/metadata_update_applied.json
  - id: vector.delete
    kind: mutation.delete
    title: Delete vector
    input: Command::VectorDelete
