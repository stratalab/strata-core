commands:
  - id: vector.collection.create
    kind: mutation.create
    title: Create vector collection
    input: Command::VectorCreateCollection
    output: Output::VectorCollectionList
    prose: commands/vector.collection.create.md
    wire_status: transitional
    errors+:
      - invalid_argument.engine.vector_dimension
      - invalid_argument.engine.embedding_model
      - invalid_argument.executor.vector_dimension
    display:
      receipt: "created collection {/data/items/0/name} ({/data/items/0/dimension} dimensions, {/data/items/0/metric})"
      identity:
        - /data/items/0/name
    fixtures:
      request: requests/v1/vector/collection_create.json
      response: responses/v1/vector/collection_list.json
      error_cases:
        - request: requests/v1/vector/collection_create_zero_dim.json
          expected_error: responses/v1/errors/vector/collection_create_zero_dim.json
        - request: requests/v1/vector/collection_create_empty_model.json
          expected_error: responses/v1/errors/vector/embedding_model_empty.json
  - id: vector.collection.delete
    kind: mutation.delete
    title: Delete vector collection
    input: Command::VectorDeleteCollection
    output: Output::Bool
    prose: commands/vector.collection.delete.md
    wire_status: transitional
    display:
      receipt: "deleted collection {/request/collection}"
      noun: collection
      identity:
        - /request/collection
    fixtures:
      setup:
        - requests/v1/vector/collection_create.json
      request: requests/v1/vector/collection_delete.json
      response: responses/v1/vector/collection_delete_true.json
  - id: vector.collection.list
    kind: read.page
    title: List vector collections
    input: Command::VectorListCollections
    output: Output::VectorCollectionList
    prose: commands/vector.collection.list.md
    display:
      columns:
        - field: /data/items/*/name
        - field: /data/items/*/dimension
        - field: /data/items/*/metric
        - field: /data/items/*/count
        - field: /data/items/*/embedding_model
    fixtures:
      setup:
        - requests/v1/vector/collection_create.json
      request: requests/v1/vector/collection_list.json
      response: responses/v1/vector/collection_list.json
  - id: vector.collection.stats
    kind: read.status
    title: Read vector collection stats
    input: Command::VectorCollectionStats
    output: Output::VectorCollectionList
    response_model: StatusResponse<{payload}>
    prose: commands/vector.collection.stats.md
    wire_status: transitional
    display:
      columns:
        - field: /data/items/*/name
        - field: /data/items/*/dimension
        - field: /data/items/*/metric
        - field: /data/items/*/count
        - field: /data/items/*/embedding_model
    fixtures:
      setup:
        - requests/v1/vector/collection_create.json
      request: requests/v1/vector/collection_stats.json
      response: responses/v1/vector/collection_list.json
  - id: vector.collection.set_embedding_model
    kind: mutation.put
    title: Declare vector collection embedding model
    input: Command::VectorSetEmbeddingModel
    output: Output::VectorCollectionList
    prose: commands/vector.collection.set_embedding_model.md
    wire_status: transitional
    errors+:
      - invalid_argument.engine.embedding_model
      - failed_precondition.engine.embedding_model_mismatch
    display:
      receipt: "updated collection {/data/items/0/name}: embedding model {/data/items/0/embedding_model}"
      identity:
        - /data/items/0/name
    fixtures:
      setup:
        - requests/v1/vector/collection_create.json
      request: requests/v1/vector/collection_set_embedding_model.json
      response: responses/v1/vector/collection_set_embedding_model.json
      error_cases:
        - setup:
            - requests/v1/vector/collection_create.json
          request: requests/v1/vector/collection_set_embedding_model_empty.json
          expected_error: responses/v1/errors/vector/embedding_model_empty.json
        - setup:
            - requests/v1/vector/collection_create_with_model.json
          request: requests/v1/vector/collection_set_embedding_model_other.json
          expected_error: responses/v1/errors/vector/embedding_model_mismatch.json
        - request: requests/v1/vector/collection_set_embedding_model.json
          expected_error: responses/v1/errors/vector/collection_missing.json
  - id: vector.count
    kind: read.status
    title: Count vectors
    input: Command::VectorCount
    output: Output::Uint
    prose: commands/vector.count.md
    display:
      value: /data
    fixtures:
      setup:
        - requests/v1/vector/collection_create.json
      request: requests/v1/vector/count.json
      response: responses/v1/vector/count.json
  - id: vector.upsert
    kind: mutation.put
    title: Upsert vector
    input: Command::VectorUpsert
    output: Output::VectorWriteResult
    prose: commands/vector.upsert.md
    errors+:
      - invalid_argument.engine.vector_dimension
      - invalid_argument.engine.vector_embedding
      - invalid_argument.engine.vector_metadata
      - invalid_argument.executor.vector_dimension
      - invalid_argument.executor.vector_input
      - failed_precondition.engine.embedding_model_missing
      - set:inference.model_runtime
    display:
      receipt: "{verb} {/data/key} in {/data/collection}"
      noun: vector
      identity:
        - /data/key
    fixtures:
      setup:
        - requests/v1/vector/collection_create.json
      request: requests/v1/vector/upsert.json
      response: responses/v1/vector/upsert_applied.json
      error_cases:
        - setup:
            - requests/v1/vector/collection_create.json
          request: requests/v1/vector/upsert_text_without_model.json
          expected_error: responses/v1/errors/vector/embedding_model_missing.json
        - setup:
            - requests/v1/vector/collection_create.json
          request: requests/v1/vector/upsert_vector_and_text.json
          expected_error: responses/v1/errors/vector/vector_input.json
        - setup:
            - requests/v1/vector/collection_create.json
          request: requests/v1/vector/upsert_neither.json
          expected_error: responses/v1/errors/vector/vector_input.json
        - setup:
            - requests/v1/vector/collection_create_unknown_model.json
          request: requests/v1/vector/upsert_text_without_model.json
          expected_error: responses/v1/errors/inference/unknown_model.json
  - id: vector.get
    kind: read.get
    title: Get vector
    input: Command::VectorGet
    output: Output::VectorData
    prose: commands/vector.get.md
    display:
      fields:
        - field: /data/value/key
        - field: /data/value/vector_revision
        - field: /data/value/version
        - field: /data/value/data/embedding
          as: json
        - field: /data/value/data/metadata
          as: json
    fixtures:
      setup:
        - requests/v1/vector/collection_create.json
        - requests/v1/vector/upsert.json
        - requests/v1/setup/vector_upsert_doc_b.json
      request: requests/v1/vector/get.json
      response: responses/v1/vector/get_found.json
      error_cases:
        - request: requests/v1/vector/get_missing_collection.json
          expected_error: responses/v1/errors/vector/get_missing_collection.json
  - id: vector.history
    kind: read.history
    title: Read vector history
    input: Command::VectorHistory
    output: Output::VectorVersionHistory
    prose: commands/vector.history.md
    display:
      columns:
        - field: /data/items/*/version
        - field: /data/items/*/vector_revision
        - field: /data/items/*/committed_at
          as: date
        - field: /data/items/*/data/embedding
          as: json
        - field: /data/items/*/data/metadata
          as: json
    fixtures:
      setup:
        - requests/v1/vector/collection_create.json
        - requests/v1/vector/upsert.json
        - requests/v1/setup/vector_upsert_doc_b.json
      request: requests/v1/vector/history.json
      response: responses/v1/vector/history_found.json
  - id: vector.exists
    kind: read.status
    title: Check vector existence
    input: Command::VectorExists
    output: Output::Bool
    prose: commands/vector.exists.md
    display:
      value: /data
    fixtures:
      setup:
        - requests/v1/vector/collection_create.json
        - requests/v1/vector/upsert.json
        - requests/v1/setup/vector_upsert_doc_b.json
      request: requests/v1/vector/exists.json
      response: responses/v1/vector/exists_true.json
  - id: vector.batch_exists
    kind: batch.itemwise_status
    title: Batch check vector existence
    input: Command::VectorBatchExists
    output: Output::VectorBatchExistsResults
    prose: commands/vector.batch_exists.md
    display:
      columns:
        - field: /data/items/*/result/exists
    fixtures:
      setup:
        - requests/v1/vector/collection_create.json
        - requests/v1/vector/upsert.json
        - requests/v1/setup/vector_upsert_doc_b.json
      request: requests/v1/vector/batch_exists.json
      response: responses/v1/vector/batch_exists.json
  - id: vector.keys
    kind: read.page
    title: List vector keys
    input: Command::VectorListKeys
    output: Output::VectorKeyPage
    prose: commands/vector.keys.md
    display:
      columns:
        - field: /data/items/*
    fixtures:
      setup:
        - requests/v1/vector/collection_create.json
        - requests/v1/vector/upsert.json
        - requests/v1/setup/vector_upsert_doc_b.json
