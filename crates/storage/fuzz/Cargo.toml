[package]
name = "strata-storage-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
strata-storage = { path = "..", default-features = false, features = ["testkit", "localfs"] }
# Scratch directories for the dual-mutation target's real on-disk store.
tempfile = "3"

