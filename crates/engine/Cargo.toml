[package]
name = "strata-engine"
version.workspace = true
description = "Database engine for Strata: data services, branches, time travel, retrieval"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["localfs"]
localfs = ["strata-storage/localfs"]
# #3502 Slice D2: the engine's opt-in retention test drives the storage pruning
# compaction dispatch (`force_branch_compaction_for_test`), which storage exposes
# only under its own `testkit`; the seams are additive test hooks that default to
# no-op, so this is behavior-neutral for production callers.
testkit = ["strata-storage/testkit"]
# Derive JSON schemas on the public error vocabulary for IDL tooling only.
wire-schemas = ["dep:schemars"]

[dependencies]
strata-core = { path = "../core" }
strata-storage = { path = "../storage", default-features = false }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
fast-hnsw = "1.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Routes the getrandom 0.2 chain (fast-hnsw -> rand 0.8) to the JS backend.
getrandom = { workspace = true, features = ["js"] }
# uuid v4 needs an explicit randomness source on wasm32-unknown-unknown.
uuid = { workspace = true, features = ["js"] }
# std::time clocks trap on wasm32; time_compat routes through JS clocks.
web-time = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
