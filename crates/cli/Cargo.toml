[package]
name = "strata-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Handwritten command-line interface for Strata V1"

[features]
# Cloud providers ride in the lean binary by default: they are pure-Rust HTTP
# clients with no build-time cost, and an API key at runtime is the only
# requirement. Local model execution (vendored llama.cpp, cmake, optional
# CUDA) stays opt-in via `inference-local`.
default = ["native", "cloud"]
# The native host surface: opening databases, the interactive REPL, MCP serving,
# init/doctor, clone, and IPC lifecycle. Everything that touches the filesystem,
# stdio, threads, or a terminal lives here. Off for wasm/embedded consumers that
# reuse only the CLI parser + renderer (see `command_from_line`).
native = [
    "dep:rustyline",
    "dep:strata-hub",
    "dep:tracing-subscriber",
    "strata-executor/localfs",
    "strata-executor/arrow",
    "strata-executor/hub",
    "strata-executor/ipc",
]
cloud = ["inference-anthropic", "inference-google", "inference-openai"]
# Provider features imply the base `inference` feature: the CLI's own command
# surface is gated on `inference`, so a provider-only selection must still
# light it up (mirrors the executor's feature graph).
inference = ["strata-executor/inference"]
inference-anthropic = ["inference", "strata-executor/inference-anthropic"]
inference-google = ["inference", "strata-executor/inference-google"]
inference-local = ["inference", "strata-executor/inference-local"]
inference-openai = ["inference", "strata-executor/inference-openai"]
# Test-only: the download offer's call-site tests drive the refuse → pull →
# retry loop against the executor's fake inference runtime. A named feature
# rather than a dev-dependency feature because the executor's `testkit`
# carries `strata-engine/testkit`, and a dev-dependency feature unifies into
# every `--workspace` build with dev-dependencies active (clippy
# `--all-targets`, `cargo test --workspace`) — switching engine's test seams
# on for every crate under test. The executor's own testkit tests run the same
# way: an explicit `--features testkit` lane in CI.
testkit = ["strata-executor/testkit"]

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
rustyline = { version = "14", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shlex = "1.3"
strata-executor = { path = "../executor", default-features = false }
strata-hub = { path = "../hub", optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
regex = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
# Test-only: the command-examples.json generator (#3059) replays examples via
# the executor's IDL tooling, then renders their output through this crate's
# renderer. Dev-dep so `idl-tooling` never reaches the shipped binary.
strata-executor = { path = "../executor", features = ["idl-tooling"] }

[[bin]]
name = "strata"
path = "src/main.rs"
# The binary is the native host; the wasm-safe parser core builds without it.
required-features = ["native"]

[lints]
workspace = true
